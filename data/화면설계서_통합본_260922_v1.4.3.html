<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화면설계서 — 메인페이지 1안·2안 (화면설계 수정 반영)</title>
<!-- 서체는 있으면 쓰고 없으면 넘어갑니다. 예전에는 이 스타일시트를 기다리느라
     사내망·오프라인에서 인쇄 미리보기가 "로드 중"에서 멈췄습니다. 2.5초 안에 오지 않으면
     링크를 걷어내고 시스템 한글 서체로 진행합니다. -->
<link id="fontCss" rel="preload" as="style"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
      onload="this.rel='stylesheet'" onerror="this.remove()">

<style>
/* ═══════════════════════════════════════════════════════════════════
   화면설계서 템플릿
   디자인 시스템 : DESIGN-apple.md (apple.com 분석 기반)
   ※ 아래 색상값은 Apple 공식 배포값이 아니라 apple.com 분석 기반 실측 근사치입니다.
   ※ 서체는 SF Pro(웹 임베드 라이선스 불가) 대신 Pretendard로 치환했습니다.

   커스터마이징 방법
   ─ 설계 내용은 전부 스크립트 하단 SCREEN_SPEC 객체에만 있습니다.
     이 객체만 교체하면 다른 화면의 설계서가 됩니다. HTML을 고칠 필요가 없습니다.
   ─ 목업 마크업은 buildSections() 안에 있습니다. 실제 화면 폭 MOCK_W(1280px) 기준으로
     작성하고, 컬럼 폭에 맞춰 자동 축소(scale)됩니다.
   ═══════════════════════════════════════════════════════════════════ */

:root{
  /* 색 — 액센트는 단 하나. 두 번째 강조색을 도입하지 않습니다. */
  --primary:#0066cc; --primary-focus:#0071e3; --primary-on-dark:#2997ff;
  --ink:#1d1d1f; --on-dark:#ffffff; --body-muted:#cccccc;
  /* 가독성 요청(2026.08.29)으로 회색 계열 텍스트를 전부 검정 계열로 통일합니다.
     변수명(-80/-48)은 기존 마크업과의 호환을 위해 유지하되, 값은 모두 --ink와 같게 둡니다 */
  --ink-muted-80:#1d1d1f; --ink-muted-48:#1d1d1f;
  --divider-soft:#f0f0f0; --hairline:#e0e0e0;
  --canvas:#ffffff; --canvas-parchment:#f5f5f7; --surface-pearl:#fafafc;
  --tile-1:#272729; --tile-2:#2a2a2c; --tile-3:#252527; --surface-black:#000000;
  --chip-translucent:#d2d2d7;

  /* 라운드 */
  --r-none:0px; --r-xs:5px; --r-sm:8px; --r-md:11px; --r-lg:18px; --r-pill:9999px;

  /* 간격 */
  --s-xxs:4px; --s-xs:8px; --s-sm:12px; --s-md:17px; --s-lg:24px;
  --s-xl:32px; --s-xxl:48px; --s-section:80px;

  /* 그림자 — 제품 팔레트에서는 이것 하나뿐. 표면 위 이미지에만 씁니다. */
  --shadow-product: rgba(0,0,0,.22) 3px 5px 30px 0;

  /* ── 문서 크롬 전용 토큰 ──────────────────────────────────────────
     설계서는 '설계 대상 화면'과 '설계서 자신'을 눈으로 구분할 수 있어야 합니다.
     제품 팔레트(흰색/f5f5f7)를 그대로 쓰면 목업이 배경에 묻히므로,
     아래 3단 층위를 문서 크롬에만 별도로 둡니다.
       바닥(--doc-stage)  <  패널(--doc-panel)  <  목업 시트(흰색) */
  --doc-stage:#d3d3d8; --doc-panel:#e9e9ee;
  --doc-edge:#b9b9bf;  --doc-sheet-line:#c6c6ca;
  --shadow-sheet: rgba(0,0,0,.12) 0 2px 10px 0;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,
              'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:#8e8e93;color:var(--ink);
  font-size:17px;line-height:1.47;letter-spacing:-.374px;font-weight:400;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
button:active{transform:scale(.95)}
button:focus-visible{outline:2px solid var(--primary-focus);outline-offset:2px}

/* ── 스테이지 : 1600×900 캔버스를 뷰포트에 맞춰 축소 ───────────────── */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#canvas{
  width:1600px;height:900px;background:var(--canvas);
  transform-origin:center center;display:flex;flex-direction:column;overflow:hidden;
}

/* ── 1) 상단 바 (global-nav : 순수 검정, 이 문서에서 검정은 여기뿐) ──── */
.doc-top{
  height:44px;flex:0 0 44px;background:var(--surface-black);color:var(--on-dark);
  display:flex;align-items:center;padding:0 var(--s-lg);gap:var(--s-lg);
}
.doc-top .crumb{font-size:12px;line-height:1;letter-spacing:-.12px;color:var(--body-muted)}
.doc-top .title{flex:1;text-align:center;font-size:14px;font-weight:600;letter-spacing:-.224px}
.doc-top .proj{font-size:12px;letter-spacing:-.12px;color:var(--body-muted)}

/* ── 2) 서브 바 (sub-nav-frosted) : 화면 선택 + 전역 토글 ──────────── */
.doc-sub{
  height:44px;flex:0 0 44px;background:rgba(245,245,247,.8);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--hairline);
  display:flex;align-items:center;padding:0 var(--s-lg);gap:var(--s-sm);
  /* backdrop-filter 가 쌓임 맥락을 만들어 화면 선택 드롭다운이 본문 뒤로 숨으므로
     이 바 자체를 본문 위로 올립니다 */
  position:relative;z-index:50;
}
.seg{display:flex;gap:4px;background:var(--divider-soft);padding:3px;border-radius:var(--r-pill)}
.seg button{
  font-size:12px;letter-spacing:-.12px;padding:5px 14px;border-radius:var(--r-pill);
  color:var(--ink-muted-80);white-space:nowrap;
}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff}

/* 화면 선택 — 화면 수가 늘면 탭을 옆으로 늘어놓을 수 없어
   메인페이지 / 서브 페이지 두 묶음의 드롭다운으로 접습니다 */
.mgrp{position:relative}
.mgrp>button{display:inline-flex;align-items:center;gap:6px}
.mgrp>button .cv{opacity:.8;font-weight:400}
.mdrop{
  display:none;position:absolute;top:calc(100% + 9px);left:0;z-index:60;min-width:236px;
  background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-md);
  box-shadow:rgba(0,0,0,.16) 0 6px 24px 0;padding:6px;
}
.mgrp.open .mdrop{display:block}
.mdrop a{
  display:block;padding:8px 12px;border-radius:var(--r-xs);
  font-size:12px;letter-spacing:-.12px;color:var(--ink-muted-80);white-space:nowrap;cursor:pointer;
}
.mdrop a:hover{background:var(--divider-soft);color:var(--ink)}
.mdrop a.sel{background:var(--primary);color:#fff}

/* 그래프 호버 말풍선 · 연도 띠 */
#tvtip{
  display:none;position:fixed;z-index:200;pointer-events:none;
  background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-sm);
  box-shadow:rgba(0,0,0,.16) 0 4px 18px 0;padding:9px 13px;
  font-size:12px;letter-spacing:-.12px;line-height:1.6;color:var(--ink);white-space:nowrap;
}
#tvtip b{display:block;margin-bottom:3px;font-weight:600}
#tvtip .r{color:var(--ink-muted-80)}
.hb{fill:#1d1d1f;fill-opacity:0;cursor:crosshair}
.hb:hover{fill-opacity:.05}
.doc-sub .spacer{flex:1}
.toggle{
  font-size:12px;letter-spacing:-.12px;padding:6px 13px;border-radius:var(--r-sm);
  background:var(--canvas);border:1px solid var(--hairline);color:var(--ink-muted-80);
}
.toggle[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-dark)}

/* ── 3) 본문 : 좌 74% 화면 UI / 우 26% 디스크립션 ──────────────────── */
.doc-body{flex:1;display:flex;min-height:0}

/* 3-1) 화면 UI 영역 ------------------------------------------------ */
.ui{width:74%;display:flex;flex-direction:column;min-width:0}
.ui-bar{
  height:34px;flex:0 0 34px;border-right:1px solid var(--doc-edge);display:flex;align-items:center;gap:var(--s-xs);
  padding:0 var(--s-md);border-bottom:1px solid var(--divider-soft);background:var(--canvas);
}
.ui-bar .lbl{font-size:12px;letter-spacing:-.12px;color:var(--ink-muted-48);margin-right:2px}
.st{
  font-size:12px;letter-spacing:-.12px;padding:4px 12px;border-radius:var(--r-pill);
  color:var(--ink-muted-80);border:1px solid var(--hairline);background:var(--canvas);
}
.st[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.ui-stage{flex:1;overflow:auto;padding:var(--s-md);background:var(--doc-stage)}
.cols{display:flex;gap:16px;align-items:flex-start}
.col{flex:1;min-width:0}
.col-cap{
  font-size:10px;letter-spacing:-.08px;color:#5a5a60;font-weight:600;
  padding-bottom:5px;margin-bottom:6px;border-bottom:1px solid var(--doc-edge);
}
/* 실제 MOCK_W 마크업을 컬럼 폭에 맞춰 축소하는 래퍼 (폭은 JS가 주입) */
.scaler{transform-origin:top left;background:var(--canvas);
  border:1px solid var(--doc-sheet-line);box-shadow:var(--shadow-sheet);overflow:hidden}

/* 3-2) 디스크립션 패널 -------------------------------------------- */
.panel{width:26%;display:flex;flex-direction:column;background:var(--doc-panel);min-width:0;border-left:1px solid var(--doc-edge)}
.panel-head{padding:var(--s-sm) var(--s-md);border-bottom:1px solid var(--doc-edge);background:var(--canvas)}
.pill-no{
  display:inline-block;background:var(--ink);color:var(--on-dark);
  font-size:12px;letter-spacing:-.12px;padding:4px 12px;border-radius:var(--r-pill);
}
.panel-head .meta{font-size:10px;letter-spacing:-.08px;color:var(--ink-muted-48);margin-top:6px}
.panel-head h2{font-size:14px;font-weight:600;letter-spacing:-.224px;margin-top:6px}
.panel-list{flex:1;overflow:auto;padding:var(--s-sm) var(--s-md) var(--s-lg)}

.spec{
  padding:10px 10px 12px;margin-bottom:6px;background:var(--canvas);
  border:1px solid rgba(0,0,0,.06);
  transition:background .15s ease;border-radius:var(--r-xs);
}
.spec.on{background:rgba(0,102,204,.07);border-color:rgba(0,102,204,.35)}
.spec.dim{opacity:.28}
.spec-h{display:flex;align-items:baseline;gap:8px}
.spec-h .n{
  flex:0 0 20px;height:20px;border-radius:var(--r-pill);background:var(--primary);
  color:#fff;font-size:11px;font-weight:600;letter-spacing:-.1px;
  display:flex;align-items:center;justify-content:center;
}
.spec-h .t{font-size:14px;font-weight:600;letter-spacing:-.224px;flex:1}
.tag{font-size:10px;letter-spacing:-.08px;padding:2px 7px;border-radius:var(--r-pill);font-weight:600}
.tag.tbd{background:var(--primary);color:#fff}
.tag.review{background:var(--divider-soft);color:var(--ink-muted-80)}
.spec ul{list-style:none;margin:5px 0 0 28px}
.spec li{
  font-size:12px;line-height:1.5;letter-spacing:-.12px;color:var(--ink-muted-80);
  padding-left:9px;position:relative;
}
.spec li::before{content:'·';position:absolute;left:0;color:var(--ink-muted-48)}
.spec li b{font-weight:700;color:var(--ink)}   /* 디스크립션 강조(2026.09.22) */
.spec .link{color:var(--primary)}

/* 심화 줄 — 라벨은 본문 불릿보다 시각적으로 물러납니다 */
.ext{margin:7px 0 0 28px;display:flex;gap:8px}
.ext .lb{
  flex:0 0 34px;font-size:10px;font-weight:600;letter-spacing:-.08px;
  color:var(--ink-muted-48);padding-top:1px;
}
.ext .bd{flex:1;font-size:11px;line-height:1.45;letter-spacing:-.1px;color:var(--ink-muted-80)}
.ext .bd .row{cursor:pointer;padding:1px 0}
.ext .bd .row:hover{color:var(--primary)}
.ext table{border-collapse:collapse;width:100%;font-size:10px;letter-spacing:-.08px}
.ext td{border-bottom:1px solid var(--hairline);padding:3px 5px;vertical-align:top}
.ext td:first-child{width:64px;font-weight:600;color:var(--ink)}
.ext td:last-child{width:80px;color:var(--ink-muted-48)}
.ext .note{color:var(--ink-muted-48);margin-top:3px}
.ext code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px}

/* 이슈 — 접기를 허용하는 두 곳 중 하나 */
.iss{margin:6px 0 0 28px}
.iss summary{
  font-size:10px;letter-spacing:-.08px;color:var(--primary);cursor:pointer;list-style:none;
}
.iss summary::-webkit-details-marker{display:none}
.iss p{font-size:10px;line-height:1.5;color:var(--ink-muted-80);margin-top:4px;padding-left:2px}

/* ── 4) 하단 바 ──────────────────────────────────────────────────── */
.doc-foot{
  height:26px;flex:0 0 26px;background:var(--doc-panel);
  border-top:1px solid var(--hairline);display:flex;align-items:center;
  padding:0 var(--s-lg);gap:var(--s-md);
  font-size:10px;letter-spacing:-.08px;color:var(--ink-muted-48);
}
.doc-foot .spacer{flex:1}


/* ── 5) 번호 배지 & 하이라이트 ────────────────────────────────────── */
.rgn{position:relative}
/* 카드 안쪽처럼 좁은 영역은 배지를 왼쪽 바깥 여백으로 빼 내용이 가려지지 않게 합니다 */
.rgn.bdg-out>.bdg{left:-30px;top:0}
/* 파일 바로보기 뷰어 — 미리보기 칸과 문서 칸 폭 배분 */
.mk .vw-thumb{flex:0 0 176px;border-right:1px solid var(--hairline);background:var(--canvas)}
.mk .vw-doc{flex:1;min-width:0}
.rgn>.bdg{
  position:absolute;top:6px;left:6px;z-index:9;
  width:24px;height:24px;border-radius:var(--r-pill);background:var(--primary);color:#fff;
  font-size:12px;font-weight:600;letter-spacing:-.1px;
  display:flex;align-items:center;justify-content:center;
  transform-origin:top left;transform:scale(var(--inv,1));
  box-shadow:0 0 0 2px rgba(255,255,255,.9);
}
.nobadge .rgn>.bdg{display:none}
.rgn.on{outline:2px solid var(--primary);outline-offset:4px}
.rgn.dim{opacity:.25}

/* ── 6) 목업 공통 (실제 MOCK_W 기준 마크업) ──────────────────────── */
.mk{width:100%;font-size:17px;line-height:1.47;letter-spacing:-.374px;color:var(--ink)}
.mk .inner{max-width:1200px;margin:0 auto}
.mk .gnb-dark{background:var(--surface-black);color:var(--on-dark);height:44px;display:flex;align-items:center}
.mk .gnb-dark .inner{display:flex;align-items:center;gap:24px;width:100%}
.mk .logo{font-size:21px;font-weight:600;letter-spacing:.231px}
.mk .gnb-dark .util{margin-left:auto;display:flex;gap:16px;font-size:14px;letter-spacing:-.224px}
.mk .navrow{background:var(--canvas);height:76px;display:flex;align-items:center;border-bottom:1px solid var(--hairline)}
.mk .navrow .inner{display:flex;align-items:center;width:100%;gap:40px}
.mk .navrow nav{display:flex;gap:40px;font-size:17px}
.mk .srch{
  margin-left:auto;width:280px;height:44px;border:1px solid rgba(0,0,0,.08);
  border-radius:var(--r-pill);display:flex;align-items:center;padding:0 20px;gap:10px;
  color:var(--ink-muted-48);font-size:17px;
}
.mk .tile{padding:80px 0;text-align:center}
.mk .tile+.tile{border-top:1px solid var(--hairline)}
.mk .tile.light{background:var(--canvas)}
.mk .tile.parch{background:var(--canvas-parchment)}
.mk h2.dsp{font-size:40px;font-weight:600;line-height:1.1;letter-spacing:0}
.mk p.lead{font-size:28px;font-weight:400;line-height:1.14;letter-spacing:.196px;margin-top:12px}
.mk p.lead.airy{font-size:24px;font-weight:300;line-height:1.5;letter-spacing:0}
.mk .ctas{display:flex;gap:24px;justify-content:center;margin-top:24px}
.mk .btn{background:var(--primary);color:#fff;border-radius:var(--r-pill);padding:11px 22px;font-size:17px}
.mk .btn.sec{background:var(--canvas);color:var(--primary)}
.mk .ph{
  background:var(--surface-pearl);border-radius:var(--r-lg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  color:var(--ink-muted-48);font-size:14px;letter-spacing:-.224px;
}
.mk .ph.shot{box-shadow:var(--shadow-product)} /* 표면 위 이미지에만 허용 */
.mk .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:40px;text-align:left}
.mk .card{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:24px}
.mk .card .nm{font-size:17px;font-weight:600;margin-top:14px}
.mk .card .ds{font-size:14px;color:var(--ink-muted-48);letter-spacing:-.224px;margin-top:4px}
.mk .tabs{display:flex;gap:32px;justify-content:center;border-bottom:1px solid var(--hairline);padding-bottom:14px}
.mk .tabs span{font-size:21px;font-weight:600;letter-spacing:.231px;color:var(--ink-muted-48)}
.mk .tabs span.sel{color:var(--ink);border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:-16px}
.mk .list{text-align:left;margin-top:24px}
.mk .list li{display:flex;align-items:center;gap:16px;padding:17px 4px;border-bottom:1px solid var(--divider-soft);list-style:none;font-size:17px}
.mk .list .dt{margin-left:auto;font-size:14px;color:var(--ink-muted-48);letter-spacing:-.224px}
.mk .new{background:var(--primary);color:#fff;font-size:12px;padding:2px 9px;border-radius:var(--r-pill);letter-spacing:-.12px}
.mk .clip{color:var(--ink-muted-48);font-size:14px}
.mk .skel{background:var(--divider-soft);border-radius:var(--r-xs);height:17px}
.mk .msg{padding:64px 0;text-align:center;color:var(--ink-muted-48);font-size:17px}
.mk .msg .big{font-size:21px;font-weight:600;color:var(--ink);letter-spacing:.231px}
.mk .msg .btn{display:inline-block;margin-top:20px}
.mk .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:40px}
.mk .stat .v{font-size:56px;font-weight:600;line-height:1.07;letter-spacing:-.28px}
.mk .stat .l{font-size:14px;color:var(--ink-muted-48);letter-spacing:-.224px;margin-top:8px}
.mk .stat .d{font-size:14px;color:var(--primary);letter-spacing:-.224px;margin-top:4px}
.mk .bnr{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.mk .ftr{background:var(--canvas-parchment);color:var(--ink-muted-80);padding:64px 0}
.mk .ftr .cols4{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;text-align:left}
.mk .ftr h4{font-size:14px;font-weight:600;letter-spacing:-.224px;color:var(--ink);margin-bottom:8px}
.mk .ftr li{list-style:none;font-size:17px;line-height:2.41;letter-spacing:0}
.mk .ftr .legal{font-size:12px;letter-spacing:-.12px;color:var(--ink-muted-48);margin-top:40px;text-align:left;line-height:1.6}
.mk .fam{
  border:1px solid var(--hairline);border-radius:var(--r-sm);background:var(--canvas);
  padding:12px 20px;font-size:14px;letter-spacing:-.224px;width:280px;text-align:left;
  display:flex;align-items:center;justify-content:space-between;
}
.mk .pagetitle{padding:48px 0 32px}
.mk .pagetitle .crumb{font-size:14px;color:var(--ink-muted-48);letter-spacing:-.224px}
.mk .pagetitle h1{font-size:40px;font-weight:600;line-height:1.1;letter-spacing:0;margin-top:12px}
/* 페이지 명칭 줄 — 제목 왼쪽, 공유·링크 유틸 버튼 오른쪽 */
.mk .ttlrow{display:flex;align-items:center;justify-content:space-between;gap:24px}
.mk .pagetitle .cnt{font-size:14px;color:var(--ink-muted-48);margin-top:8px;letter-spacing:-.224px}
.mk .filter{display:flex;gap:12px;align-items:center;background:var(--canvas-parchment);border-radius:var(--r-lg);padding:17px 24px}
.mk .sel{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-sm);padding:11px 17px;font-size:14px;letter-spacing:-.224px;min-width:140px;display:flex;justify-content:space-between}
.mk .paging{display:flex;gap:8px;justify-content:center;padding:40px 0;font-size:14px;letter-spacing:-.224px}
.mk .paging span{width:36px;height:36px;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;color:var(--ink-muted-48)}
.mk .paging span.sel{background:var(--primary);color:#fff}
.mk .paging span.off{color:var(--chip-translucent)}


/* ── 8) 원본 보기 : 목업을 100% 배율로 펼쳐 확인 ──────────────────── */
#zoom{
  position:fixed;inset:0;z-index:99;background:rgba(29,29,31,.55);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  display:none;overflow:auto;padding:56px 0 40px;
}
#zoom.open{display:block}
#zoom .sheet{
  margin:0 auto;background:var(--canvas);border-radius:var(--r-lg);overflow:hidden;
  box-shadow:var(--shadow-product);
}
#zoom .bar{
  position:fixed;top:0;left:0;right:0;height:44px;background:var(--surface-black);
  color:var(--on-dark);display:flex;align-items:center;gap:var(--s-md);
  padding:0 var(--s-lg);font-size:12px;letter-spacing:-.12px;
}
#zoom .bar .spacer{flex:1}
#zoom .bar button{
  background:var(--canvas);color:var(--ink);font-size:12px;
  padding:6px 14px;border-radius:var(--r-pill);
}

/* ── 참고 이미지 라이트박스 : refs 안의 이미지를 새 탭이 아닌 오버레이로 표시
   (data: URI를 target="_blank"로 열면 최신 브라우저가 최상위 탐색을 차단해
   빈 화면만 뜨는 문제가 있어, DOM 오버레이 방식으로 대체합니다) ────────── */
#refimg{
  position:fixed;inset:0;z-index:101;background:rgba(29,29,31,.72);
  display:none;align-items:center;justify-content:center;padding:48px;
}
#refimg.open{display:flex}
#refimg img{max-width:100%;max-height:100%;border-radius:var(--r-md);box-shadow:var(--shadow-product);background:#fff}
#refimg button{
  position:fixed;top:20px;right:24px;background:var(--canvas);color:var(--ink);
  font-size:12px;padding:6px 14px;border-radius:var(--r-pill);
}


/* 공통 영역(번호 미부여)은 옅게 처리해 신규 정의와 구분합니다 */
.cmn{opacity:.55}
.mk .common{background:var(--divider-soft);color:var(--ink-muted-48);font-size:14px;letter-spacing:-.224px;padding:14px 0;text-align:center}

/* 상세페이지 */
.mk .art{padding:48px 0 0}
.mk .art h1{font-size:40px;font-weight:600;line-height:1.1;letter-spacing:0}
.mk .art .meta{display:flex;gap:24px;font-size:14px;color:var(--ink-muted-48);letter-spacing:-.224px;margin-top:17px;padding-bottom:24px;border-bottom:1px solid var(--hairline)}
.mk .art .cont{font-size:17px;line-height:1.9;text-align:left;padding:32px 0 40px;color:var(--ink-muted-80)}
.mk .att{border:1px solid var(--hairline);border-radius:var(--r-lg);padding:20px 24px;text-align:left}
.mk .att .row{display:flex;align-items:center;gap:10px;font-size:14px;letter-spacing:-.224px;padding:6px 0}
.mk .att .sz{color:var(--ink-muted-48);margin-left:auto}
.mk .nav2{border-top:1px solid var(--hairline);margin-top:40px}
.mk .nav2 .row{display:flex;gap:20px;align-items:center;padding:17px 4px;border-bottom:1px solid var(--divider-soft);font-size:17px;text-align:left}
.mk .nav2 .lb{flex:0 0 88px;font-size:14px;color:var(--ink-muted-48);letter-spacing:-.224px}
.mk .acts{display:flex;justify-content:center;gap:12px;padding:40px 0}

/* 관리자 */
.mk .adm-top{background:var(--surface-black);color:var(--on-dark);height:56px;display:flex;align-items:center;padding:0 24px;gap:20px;font-size:14px;letter-spacing:-.224px}
.mk .adm-top .nm{font-size:17px;font-weight:600}
.mk .adm-top .r{margin-left:auto;display:flex;gap:16px;color:var(--body-muted)}
.mk .adm-body{display:flex;min-height:620px;text-align:left}
.mk .lnb{flex:0 0 240px;background:var(--canvas-parchment);border-right:1px solid var(--hairline);padding:24px 0}
.mk .lnb h5{font-size:12px;letter-spacing:-.12px;color:var(--ink-muted-48);padding:0 24px;margin:20px 0 6px}
.mk .lnb li{list-style:none;font-size:17px;padding:11px 24px;color:var(--ink-muted-80)}
.mk .lnb li.sel{background:var(--primary);color:#fff;margin:0 12px;padding:11px 12px;border-radius:var(--r-sm)}
.mk .adm-main{flex:1;padding:32px;min-width:0}
.mk .adm-main h3{font-size:28px;font-weight:600;line-height:1.14;letter-spacing:.196px}
.mk .tbl{width:100%;border-collapse:collapse;margin-top:17px;font-size:14px;letter-spacing:-.224px}
.mk .tbl th{background:var(--canvas-parchment);font-weight:600;padding:12px 10px;border-top:1px solid var(--ink);border-bottom:1px solid var(--hairline);text-align:left}
.mk .tbl td{padding:12px 10px;border-bottom:1px solid var(--divider-soft)}
.mk .tbl .c{text-align:center;width:44px;color:var(--ink-muted-48)}
.mk .chip{font-size:12px;letter-spacing:-.12px;padding:3px 10px;border-radius:var(--r-pill);background:var(--divider-soft);color:var(--ink-muted-80)}
.mk .chip.on{background:var(--primary);color:#fff}
.mk .bulk{display:flex;gap:8px;align-items:center;margin-top:17px}
.mk .btn.sm{font-size:14px;padding:8px 15px;border-radius:var(--r-sm);background:var(--ink);color:#fff}
.mk .btn.sm.gh{background:var(--canvas);color:var(--ink-muted-80);border:1px solid var(--hairline)}


/* ── 9) 식별번호 · 버전 ───────────────────────────────────────────── */
.idrow{display:flex;gap:5px;align-items:center;margin:5px 0 0 28px;flex-wrap:wrap}
.idc{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;
  padding:2px 6px;border-radius:var(--r-xs);border:1px solid var(--hairline);
  color:var(--ink-muted-48);background:var(--canvas-parchment);white-space:nowrap;
}
.idc.be{
  border-color:rgba(0,102,204,.35);color:var(--primary);
  background:rgba(0,102,204,.07);cursor:pointer;
}
.idc.be:hover{background:var(--primary);color:#fff}
.idc.be.shared{font-weight:700}
.idc.be.shared::after{content:' ⇄'}
.idc.none{color:var(--chip-translucent);border-style:dashed;background:none}
/* 짝 이동 칩 — 같은 백엔드 기능을 쓰는 '다른 화면'의 항목으로 바로 건너뜁니다 */
.idc.jump{
  border-color:rgba(0,102,204,.28);color:var(--primary);
  background:var(--canvas);cursor:pointer;
}
.idc.jump:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.spec.arrived{animation:arrive 1.6s ease}
@keyframes arrive{
  0%,40%{background:rgba(0,102,204,.16);border-color:var(--primary)}
  100%{background:var(--canvas)}
}
/* 돌아가기 */
#btnBack{margin-left:auto;border-color:var(--primary);color:var(--primary)}
.vc{font-size:10px;letter-spacing:-.08px;color:var(--ink-muted-48);margin-left:auto}
.vc.now{color:var(--primary);font-weight:600}
.spec.linked{border-color:var(--primary);background:rgba(0,102,204,.05)}

/* 오버레이 공통 — 변경이력 / 연동 매칭표 */
#hist{
  position:fixed;inset:0;z-index:98;background:rgba(29,29,31,.55);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:none;
  align-items:center;justify-content:center;
}
#hist.open{display:flex}
#hist .box{
  width:900px;max-height:78vh;background:var(--canvas);border-radius:var(--r-lg);
  overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-product);
}
#hist .hd{padding:20px 24px 14px;border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:12px}
#hist .hd h3{font-size:21px;font-weight:600;letter-spacing:.231px}
#hist .hd .sub{font-size:12px;color:var(--ink-muted-48);letter-spacing:-.12px}
#hist .hd .spacer{flex:1}
#hist .hd button{background:var(--ink);color:#fff;font-size:12px;padding:7px 15px;border-radius:var(--r-pill)}
#hist .bd{overflow:auto;padding:8px 24px 24px}
#hist .row{display:flex;gap:20px;padding:16px 0;border-bottom:1px solid var(--divider-soft)}
#hist .row:last-child{border-bottom:0}
#hist .vv{
  flex:0 0 88px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:14px;font-weight:600;
}
#hist .vv .d{font-family:inherit;font-size:11px;font-weight:400;color:var(--ink-muted-48);margin-top:3px}
#hist .row.now .vv{color:var(--primary)}
#hist .row.now .vv .d{color:var(--primary)}
#hist .cc{flex:1;min-width:0}
#hist .cc .ch{font-size:14px;letter-spacing:-.224px;line-height:1.5}
#hist .cc .by{font-size:11px;color:var(--ink-muted-48);margin-top:4px}
#hist .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
#hist .chip{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;
  padding:3px 8px;border-radius:var(--r-xs);cursor:pointer;
  border:1px solid rgba(0,102,204,.3);color:var(--primary);background:rgba(0,102,204,.06);
}
#hist .chip:hover{background:var(--primary);color:#fff}
#hist .chip.all{border-color:var(--hairline);color:var(--ink-muted-48);background:var(--canvas-parchment)}
#hist .chip.all:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
#hist .foot{font-size:11px;color:var(--ink-muted-48);margin-top:16px;line-height:1.6}

/* 매칭표 오버레이 */
#mtx{
  position:fixed;inset:0;z-index:98;background:rgba(29,29,31,.55);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:none;
  align-items:center;justify-content:center;
}
#mtx.open{display:flex}
#mtx .box{
  width:1080px;max-height:78vh;background:var(--canvas);border-radius:var(--r-lg);
  overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-product);
}
#mtx .hd{padding:20px 24px 14px;border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:12px}
#mtx .hd h3{font-size:21px;font-weight:600;letter-spacing:.231px}
#mtx .hd .sub{font-size:12px;color:var(--ink-muted-48);letter-spacing:-.12px}
#mtx .hd .spacer{flex:1}
#mtx .hd button{background:var(--ink);color:#fff;font-size:12px;padding:7px 15px;border-radius:var(--r-pill)}
#mtx .bd{overflow:auto;padding:0 24px 24px}
#mtx table{width:100%;border-collapse:collapse;font-size:12px;letter-spacing:-.12px}
#mtx th{
  position:sticky;top:0;background:var(--canvas);text-align:left;font-weight:600;
  padding:10px 8px;border-bottom:1px solid var(--ink);
}
#mtx td{padding:9px 8px;border-bottom:1px solid var(--divider-soft);vertical-align:top}
#mtx tbody tr[data-ref]{cursor:pointer}
#mtx tbody tr[data-ref]:hover td{background:rgba(0,102,204,.07)}
#mtx tbody tr[data-ref]:hover td:first-child{background:var(--canvas)}
#mtx tr.grp td{background:var(--canvas-parchment);font-weight:600}
#mtx .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
#mtx .be{color:var(--primary);font-weight:600}
#mtx .warn{color:var(--primary)}


/* ── 10) 점검 패널 ────────────────────────────────────────────────── */
#chk{
  position:fixed;inset:0;z-index:98;background:rgba(29,29,31,.55);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:none;
  align-items:center;justify-content:center;
}
#chk.open{display:flex}
#chk .box{
  width:1000px;max-height:80vh;background:var(--canvas);border-radius:var(--r-lg);
  overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-product);
}
#chk .hd{padding:20px 24px 14px;border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:12px}
#chk .hd h3{font-size:21px;font-weight:600;letter-spacing:.231px}
#chk .hd .sub{font-size:12px;color:var(--ink-muted-48);letter-spacing:-.12px}
#chk .hd .spacer{flex:1}
#chk .hd button{background:var(--ink);color:#fff;font-size:12px;padding:7px 15px;border-radius:var(--r-pill)}
#chk .bd{overflow:auto;padding:4px 24px 24px}
#chk h4{
  font-size:12px;font-weight:600;letter-spacing:-.12px;color:var(--ink-muted-48);
  margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--hairline);
}
#chk .step{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--divider-soft)}
#chk .step .k{
  flex:0 0 22px;height:22px;border-radius:var(--r-pill);font-size:11px;font-weight:600;
  display:flex;align-items:center;justify-content:center;
}
#chk .step .k.ok{background:var(--primary);color:#fff}
#chk .step .k.no{background:var(--divider-soft);color:var(--ink-muted-48)}
#chk .step .tt{flex:1;font-size:13px;letter-spacing:-.2px}
#chk .step .tt .d{font-size:11px;color:var(--ink-muted-48);margin-top:2px}
#chk .step .cnt{font-size:11px;color:var(--ink-muted-48);white-space:nowrap}
#chk .f{
  display:flex;gap:10px;align-items:flex-start;padding:8px 0;
  border-bottom:1px solid var(--divider-soft);font-size:12px;letter-spacing:-.12px;cursor:pointer;
}
#chk .f:hover{background:rgba(0,102,204,.05)}
#chk .f .lv{
  flex:0 0 42px;font-size:10px;font-weight:600;text-align:center;
  padding:2px 0;border-radius:var(--r-xs);
}
#chk .f .lv.err{background:var(--primary);color:#fff}
#chk .f .lv.warn{background:rgba(0,102,204,.12);color:var(--primary)}
#chk .f .lv.info{background:var(--divider-soft);color:var(--ink-muted-48)}
#chk .f .loc{flex:0 0 150px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--ink-muted-48)}
#chk .f .msg{flex:1;color:var(--ink-muted-80)}
#chk .pass{font-size:13px;color:var(--primary);padding:14px 0;font-weight:600}
#chk .note{font-size:11px;color:var(--ink-muted-48);line-height:1.6;margin-top:14px}

/* ── 7) 인쇄 : A4 가로 · 전 화면 · 페이지를 스크립트가 직접 나눕니다 ──
   화면(#stage)을 그대로 축소해 찍으면 두 단이 각자 다른 지점에서 잘려
   '끊어진 목업 + 끊어진 디스크립션'이 나옵니다. 브라우저의 자동 페이지
   나누기(break-inside:avoid)에 맡겨도 빈 페이지가 섞입니다.
   그래서 buildPrintDoc() 이 영역과 카드의 실제 높이를 재서 A4 한 장에
   들어갈 만큼씩 직접 담아 .pd-page 를 만듭니다. 규칙은 셋입니다.
     ─ 영역(목업 블록)과 항목 카드는 어떤 경우에도 중간에서 자르지 않습니다.
       한 장에 못 담을 만큼 큰 것은 그 장을 통째로 쓰고 축소해 넣습니다.
     ─ 페이지마다 머리글(빵부스러기·화면번호·화면명·사업명·탭·툴바·버전)을 넣습니다.
     ─ 화면(메뉴)이 바뀌면 반드시 새 장에서 시작합니다.
   축소는 transform 이 아니라 zoom 으로 합니다. transform 은 레이아웃에
   반영되지 않아 높이를 잴 수 없습니다. */
@page{size:A4 landscape;margin:8mm}

#printDoc{display:none}

@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  #stage,#zoom,#mtx,#hist,#chk,#refimg{display:none !important}

  #printDoc{display:block !important;position:static !important;
    left:auto !important;top:auto !important;width:auto !important;background:#fff}

  .pd-page{
    break-after:page;page-break-after:always;
    break-inside:avoid;page-break-inside:avoid;
    overflow:hidden;position:relative;background:#fff;
  }
  .pd-page:last-child{break-after:auto;page-break-after:auto}

  /* 페이지마다 반복되는 머리글 */
  .pd-h1{
    background:var(--surface-black);color:var(--on-dark);
    display:flex;align-items:center;gap:14px;padding:6px 10px;
    font-size:9pt;letter-spacing:-.1px;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .pd-h1 .c{color:var(--body-muted);white-space:nowrap}
  .pd-h1 .t{flex:1;text-align:center;font-weight:700}
  .pd-h2{
    display:flex;align-items:flex-start;gap:8px;
    border-bottom:1px solid var(--doc-edge);padding:4px 10px 5px;
    font-size:7.5pt;color:var(--ink-muted-48);
  }
  /* 화면이 12개로 늘어 한 줄에 다 들어가지 않으므로 탭만 줄바꿈을 허용합니다.
     머리글 높이는 buildPrintDoc 이 실측하므로 줄이 늘어도 조판이 어긋나지 않습니다 */
  .pd-h2 .tabs{flex:1 1 auto;display:flex;flex-wrap:wrap;gap:3px 5px;min-width:0}
  .pd-h2 .tab{white-space:nowrap}
  .pd-h2 .tab{border:1px solid var(--hairline);border-radius:9999px;padding:1px 8px;color:var(--ink-muted-80)}
  .pd-h2 .tab.on{background:var(--primary);border-color:var(--primary);color:#fff;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pd-h2 .tools{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:3px 5px;justify-content:flex-end;max-width:34%}
  .pd-h2 .tools span{border:1px solid var(--hairline);border-radius:4px;padding:1px 6px;white-space:nowrap}
  .pd-h2 .sp{flex:1}
  .pd-h2 .ver{flex:0 0 auto;color:var(--ink-muted-80);font-weight:600;white-space:nowrap;text-align:right}

  /* 부(部)·쪽 표지줄 */
  .pd-part{
    display:flex;align-items:center;gap:8px;
    font-size:8pt;font-weight:700;color:var(--ink-muted-80);
    border-left:3px solid var(--primary);padding:2px 8px;margin:5px 0;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .pd-part .sp{flex:1}
  .pd-part .pg{font-weight:400;color:var(--ink-muted-48)}

  /* 목업 — 페이지 폭에 맞춰 한 단으로 펼칩니다 */
  .pd-mk-in{transform:none}
  .pd-mk-in .rgn{outline:1px dashed var(--doc-sheet-line);outline-offset:-1px}

  /* 디스크립션 — 2단. 어느 카드도 잘리지 않도록 스크립트가 미리 나눕니다 */
  .pd-cols{display:flex;align-items:flex-start}
  .pd-col{flex:1;min-width:0}
  .pd-col .spec{background:#fff;border:1px solid var(--hairline);margin-bottom:5px}
  .pd-col .iss p{display:block}
  .pd-col .iss summary{list-style:none}
}

/* 측정 중에만 쓰는 상태 — 화면 밖에서 실제 인쇄 폭으로 레이아웃만 잡습니다 */
#printDoc.measuring{
  display:block;position:absolute;left:-30000px;top:0;
  background:#fff;z-index:-1;
}
#printDoc.measuring .iss p{display:block}
#printDoc.measuring .spec{background:#fff;border:1px solid var(--hairline);margin-bottom:5px}

/* 가로 막대 그래프 — 0~100% 축·그리드라인·호버 상세 카드 (핵심데이터 시각화 상세 등) */
.hbar-axis{position:relative}
.hbar-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--divider-soft)}
.hbar-wrap{position:relative}
.hbar-track{position:relative;background:var(--divider-soft);border-radius:4px;height:18px;overflow:visible;flex:1;min-width:0}
.hbar-fill{height:100%;border-radius:4px;position:relative}
.hbar-wrap:hover .hbar-fill{filter:brightness(1.08)}
.hbar-cathover{position:relative}
.hbar-catlabel{display:inline-flex;align-items:center;gap:4px}
.hbar-cathover:hover .hbar-catlabel{color:var(--primary)}
.hbar-cardbox{display:none;position:absolute;top:22px;left:0;z-index:30;pointer-events:none}
.hbar-cathover:hover .hbar-cardbox{display:block}
.hbar-card{
  background:#fff;border-radius:14px;min-width:220px;padding:14px 18px;
  box-shadow:0 10px 28px rgba(0,0,0,.14), 0 2px 8px rgba(0,0,0,.06);
  border:1px solid var(--hairline);
}
.hbar-card-title{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:10px}
.hbar-card-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}
.hbar-card-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;display:inline-block}
.hbar-card-name{color:var(--ink-muted-80);flex:1}
.hbar-card-val{font-weight:700;color:var(--ink);min-width:32px;text-align:right}
</style>
</head>

/* ── 히어로 섹션 (1안) — 슬라이드 3장이 순서대로 전환되는 캐러셀 ────────

   실제로 3개 화면(슬라이드)이 전환되면서 그 슬라이드의 카피가 차례로
   노출되는 구조입니다. 점·화살표를 실제로 누르면 슬라이드가 전환되고
   카피 텍스트도 즉시 바뀝니다(heroGoTo/heroNext). 슬라이드 3장 전체
   카피는 우측 디스크립션(참고)에 병기합니다. */
function heroMK(){
  const slides = [
    '특수교육을 향한 따뜻한 시선,<br>현장을 온전히 이해하는 것에서 시작합니다.',

  const slidesAttr = JSON.stringify(slides).replace(/"/g,'&quot;');

/* 히어로 캐러셀 인터랙션 — 클릭한 인스턴스(가장 가까운 .hero-mk)만 갱신합니다.
   메인 캔버스와 100% 보기가 동시에 열려 있어도 서로 간섭하지 않습니다. */
function heroGoTo(el, i){
  const wrap = el.closest('.hero-mk');
  const slides = JSON.parse(wrap.dataset.slides);
  wrap.dataset.idx = i;
  wrap.querySelector('.hero-n').textContent = i + 1;
  wrap.querySelector('.hero-headline').innerHTML = slides[i];
  wrap.querySelectorAll('.hero-dot').forEach((d, di) => {
    d.style.background = di === i ? 'var(--primary)' : 'var(--chip-translucent)';
  });
}
/* ── sub_0102 특수교육 현황 : 지표 탭·보기 기준 클릭 전환 ─────────────
   오프라인 프로토타입(#/trend)과 같은 동작입니다. 학생 수/기관 수 탭과
   계·배치별·급별 버튼을 실제로 누르면 컨트롤·그래프·통계표가 그 조합으로
   바뀝니다. 조합 6종을 미리 그려 두고 보이는 것만 바꾸는 방식이라
   목업 안에서 왕복해도 상태가 어긋나지 않습니다. */
function tvSet(el, mk, vw){
  const root = el.closest('.ui-stage') || document.body;
  mk = mk || root.dataset.tvMk || 'student';
  vw = vw || root.dataset.tvVw || 'total';
  root.dataset.tvMk = mk; root.dataset.tvVw = vw;
  const key = mk + '|' + vw;
  root.querySelectorAll('[data-pane]').forEach(p=>{
    p.style.display = (p.dataset.pane === key) ? '' : 'none';
  });
}

/* ── 그래프 호버 : 연도별 수치를 말풍선으로 보여 줍니다(오프라인 프로토타입과 동일) ──
   그래프마다 연도 폭만큼의 투명한 띠를 얹고, 그 위에서 움직이면 말풍선을 띄웁니다.
   목업이 축소(transform:scale)돼 있어도 clientX/clientY 는 화면 좌표라 위치가 맞습니다. */
function tvTip(ev, txt){
  let el = document.getElementById('tvtip');
  if(!el){ el = document.createElement('div'); el.id = 'tvtip'; document.body.appendChild(el); }
  const p = txt.split('§');
  el.innerHTML = `<b>${p[0]}년</b>` + p.slice(1).map(t=>`<div class="r">${t}</div>`).join('');
  el.style.display = 'block';
  const w = el.offsetWidth || 200, h = el.offsetHeight || 60;
  el.style.left = Math.max(8, Math.min(ev.clientX + 14, window.innerWidth  - w - 12)) + 'px';
  el.style.top  = Math.max(8, Math.min(ev.clientY + 14, window.innerHeight - h - 12)) + 'px';
}
function tvTipOff(){ const el = document.getElementById('tvtip'); if(el) el.style.display = 'none'; }

/* 같은 화면 안에서 미리 그려 둔 조각(pane)만 바꿔 보여 줍니다 — 배치유형 필터에 씁니다 */
function tvPane(el, key){
  const root = el.closest('.ui-stage') || document.body;
  root.querySelectorAll('[data-pane]').forEach(p=>{
    p.style.display = (p.dataset.pane === key) ? '' : 'none';
  });
  tvTipOff();
}

/* 보기 기준 버튼으로 다른 화면으로 이동합니다. mk 를 주면 이동한 화면의 지표 탭도 맞춰 둡니다 */
function tvGo(ref, mk){
  gotoRef(ref, true);
  if(!mk) return;
  const r = document.querySelector('.ui-stage'); if(!r) return;
  r.dataset.tvMk = mk; r.dataset.tvVw = 'total';
  r.querySelectorAll('[data-pane]').forEach(p=>{
    p.style.display = (p.dataset.pane === mk + '|total') ? '' : 'none';
  });
}

function heroNext(el){
  const wrap = el.closest('.hero-mk');
  const i = (parseInt(wrap.dataset.idx, 10) + 1) % 3;
  heroGoTo(wrap.querySelector(`.hero-dot[data-i="${i}"]`), i);
}

    /* 기관 수 계는 연도별 통계집 주요 현황 표의 공표 계. 산식이 다른 해는 주석(※), 비교 불가 연도의 증가율은 표시 안 함 */
    const TNOTE = {2008:'공표 계 — 특수교육지원센터 미포함, 특수학급 운영 학교와 일반학급 배치 학교를 중복 제외 없이 합산',

    const SCR = {trend_sp:['student','placement'], trend_sl:['student','level'],

    const unitOfM  = (mk,k) => mk==='student' ? '명' : (k==='특수교육지원센터 장애영아 학급' ? '학급' : (k==='전체' ? '개' : '개교'));
    const unitM    = mk => mk==='student' ? '명' : '개';
    const groupOf  = (mk,vw,flt) => vw==='total' ? {'전체':TD[mk].total}
                     : vw==='placement' ? TD[mk].byPlacement
                     : vw==='type' ? TD[mk].byType
                     : (!flt || flt==='전체') ? TD[mk].byLevel : TD[mk].cross[flt];

    /* ── 콤보 그래프(계) : 규모 막대 + 전년 대비 증가율 꺾은선 ── */
    const comboSVG = (mk) => {
      const vals = TD[mk].total;
      const W=1160,H=400,L=76,RG=82,T=36,B=48;
      const pw=W-L-RG, phh=H-T-B, n=vals.length;
      const step = mk==='student' ? 20000 : 4000;
      const yMax = Math.ceil(Math.max(...vals.filter(v=>v!=null))/step)*step;
      const gr = vals.map((v,i)=> (i===0 || v==null || vals[i-1]==null || (mk==='institution' && NOGROWTH.includes(TY[i]))) ? null : +(((v-vals[i-1])/vals[i-1])*100).toFixed(1));
      const gvs = gr.filter(v=>v!==null);
      const gMax = Math.ceil(Math.max(...gvs)*1.8/3)*3;
      const gMin = Math.min(0, Math.floor((Math.min(...gvs)-0.5)/3)*3);
      const cx = i => L + pw*(i+0.5)/n;
      const yv = v => T + phh*(1 - v/yMax);
      const yg = v => T + phh*(1 - (v-gMin)/(gMax-gMin));
      const bw = pw/n*0.52;
      const yt = [0,1,2,3,4].map(k=>yMax*k/4);
      const gt = []; for(let v=gMin; v<=gMax+0.001; v+=3) gt.push(+v.toFixed(0));
      const grid = yt.map(v=>`<line x1="${L}" y1="${yv(v).toFixed(1)}" x2="${L+pw}" y2="${yv(v).toFixed(1)}" stroke="#EFEDE6"/>`).join('');

      const glab = gt.map(v=>`<text x="${L+pw+10}" y="${(yg(v)+4).toFixed(1)}" font-size="12" fill="#8A8F9C">${v}%</text>`).join('');
      const bars = vals.map((v,i)=> v==null ? '' : `<rect x="${(cx(i)-bw/2).toFixed(1)}" y="${yv(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(T+phh-yv(v)).toFixed(1)}" rx="3" fill="#2B6CB8"/>`).join('');
      /* 증가율이 없는 연도에서 선을 끊는다 */
      const gsegs = []; let gcur = [];
      gr.forEach((v,i)=>{ if(v===null){ if(gcur.length) gsegs.push(gcur); gcur=[]; } else gcur.push(`${cx(i).toFixed(1)},${yg(v).toFixed(1)}`); });
      if(gcur.length) gsegs.push(gcur);
      const gdots = gr.map((v,i)=> v===null?'':`<circle cx="${cx(i).toFixed(1)}" cy="${yg(v).toFixed(1)}" r="3.4" fill="#E8590C"/>`).join('');
      const xlab = TY.map((y,i)=>`<text x="${cx(i).toFixed(1)}" y="${T+phh+22}" text-anchor="middle" font-size="11.5" fill="#8A8F9C">${y}</text>`).join('');
      /* 연도 폭만큼의 투명한 띠 — 그 위에서 움직이면 그 해 수치가 말풍선으로 뜹니다 */
      const hov = vals.map((v,i)=>{
        const t = `${TY[i]}§${mk==='student'?'전체 인원':'전체 기관 수(공표 계)'}: ${nf(v)}${v==null?'':unitM(mk)}`
                + (gr[i]===null ? '' : `§전년 대비 증가율: ${gr[i]>0?'+':''}${gr[i]}%`)
                + (mk==='institution' && TNOTE[TY[i]] ? `§※ ${TNOTE[TY[i]]}` : '');
        return `<rect class="hb" x="${(L+pw*i/n).toFixed(1)}" y="${T}" width="${(pw/n).toFixed(1)}" height="${phh+26}"
          onmousemove="tvTip(event,'${t}')" onmouseout="tvTipOff()"/>`;
      }).join('');
      return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img"
        aria-label="${mk==='student'?'전체 학생 수':'전체 기관 수'} 2008~2026년 추이 막대와 전년 대비 증가율 꺾은선">
        ${grid}${ylab}${glab}
        <line x1="${L}" y1="${T+phh}" x2="${L+pw}" y2="${T+phh}" stroke="#E4E0D6"/>
        ${bars}${gsegs.map(sg=>`<polyline points="${sg.join(' ')}" fill="none" stroke="#E8590C" stroke-width="2.4"/>`).join('')}${gdots}${xlab}
        <g font-size="12.5" fill="#495057">
          <rect x="${L+pw-292}" y="6" width="12" height="9" fill="#2B6CB8"/>
          <text x="${L+pw-274}" y="15">${mk==='student'?'전체 인원(명)':'전체 기관 수(공표 계)'}</text>
          <rect x="${L+pw-130}" y="10" width="14" height="2.4" fill="#E8590C"/>
          <text x="${L+pw-110}" y="15">전년 대비 증가율(%)</text>

    /* ── 소형 다중 패널(배치별·급별) : 계열마다 0에서 시작하는 독립 세로축 ── */

        const ox=col*cw+(cols>3?50:62), oy=row*chh+56, pw=cw-(cols>3?72:104), phh=chh-108;
        const arr=g[k], raw=Math.max(...arr.filter(v=>v!=null))||1;
        /* 눈금이 8757 같은 어중간한 값으로 찍히지 않도록 자릿수에 맞춰 올림합니다 */
        const unitStep=Math.pow(10, Math.floor(Math.log10(raw/3)));
        const stepN=Math.ceil(raw/3/unitStep)*unitStep, mx=stepN*3;
        const yv=v=>oy+phh*(1-v/mx);
        const px=j=>ox+pw*j/(arr.length-1);
        /* 미집계(null) 연도는 선을 끊는다 — 0으로 그리면 급증처럼 보인다 */
        const segs=[]; let cur=[];
        arr.forEach((v,j)=>{ if(v==null){ if(cur.length) segs.push(cur); cur=[]; } else cur.push(`${px(j).toFixed(1)},${yv(v).toFixed(1)}`); });
        if(cur.length) segs.push(cur);
        const tk=[0,1,2,3].map(t=>stepN*t);
        const grid=tk.map(v=>`<line x1="${ox}" y1="${yv(v).toFixed(1)}" x2="${ox+pw}" y2="${yv(v).toFixed(1)}" stroke="#EFEDE6"/>`).join('');
        const ylab=tk.map(v=>`<text x="${ox-8}" y="${(yv(v)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#8A8F9C">${v>=10000?(Math.round(v/1000)/10)+'만':nf(Math.round(v))}</text>`).join('');
        const hw=pw/(arr.length-1);
        const hov=arr.map((v,j)=>`<rect class="hb" x="${Math.max(ox, px(j)-hw/2).toFixed(1)}" y="${oy-24}" width="${hw.toFixed(1)}" height="${phh+46}"
          onmousemove="tvTip(event,'${TY[j]}§${k}: ${nf(v)}${v==null?'':unitOfM(mk,k)}')" onmouseout="tvTipOff()"/>`).join('');
        return `${grid}${ylab}
          <text x="${ox-2}" y="${oy-14}" font-size="12.5" font-weight="600" fill="#495057">${k} · ${nf(arr.at(-1))}${unitOfM(mk,k)}</text>
          ${segs.map(sg=>`<polyline points="${sg.join(' ')}" fill="none" stroke="${TC[k]||'#2B6CB8'}" stroke-width="2.2"/>`).join('')}
          <line x1="${ox}" y1="${(oy+phh).toFixed(1)}" x2="${ox+pw}" y2="${(oy+phh).toFixed(1)}" stroke="#E4E0D6"/>
          <text x="${ox}" y="${oy+phh+18}" font-size="10" fill="#8A8F9C">2008</text>
          <text x="${ox+pw}" y="${oy+phh+18}" text-anchor="end" font-size="10" fill="#8A8F9C">2026</text>${hov}`;
      }).join('');
      return `<svg viewBox="0 0 1160 ${H}" width="100%" style="display:block" role="img"
        aria-label="${label} 계열별 독립 패널">${body}</svg>`;
    };

    /* ── 페이지 헤더 ── */
    const pageHeadMK = () => `<div class="inner">

      </div></div>`;

    /* ── 숫자로 보는 특수교육 — 메인페이지와 같은 회색 톤, 미니 그래프 없음 ── */

    const compBar = (year, segs) => `

        <div style="flex:1;display:flex;height:26px;border-radius:6px;overflow:hidden">
          ${segs.map(s=>`<div style="width:${s[1]}%;background:${s[2]};display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff">${s[1]>=8?s[1]+'%':''}</div>`).join('')}

    const heroTrendMK = () => `<div class="tile parch"><div class="inner" style="text-align:left">
      <div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px">

        ${heroCell('유치원 과정 재학생','7,498','명','2008년 3,236명 대비 <b>2.3배</b> — 조기 개입 확대')}
        ${heroCell('특수교육 운영 기관','12,741','개','2010년 10,296개 대비 <b>+23.7%</b> — 학교·센터 공표 계')}
        ${heroCell('특수학급 운영 일반학교','9,930','개교','2008년 4,971개교 대비 <b>+99.8%</b>')}
        ${heroCell('일반학급에서 함께 배우는 학생','19,202','명','2008년 10,227명 대비 <b>+87.8%</b>')}

        ${compBar(2026,[['특수학교',25.8,'#7C879C'],['특수학급',58.6,'#63A8F5'],['완전통합',15.4,'#3FBF8F'],['지원센터',0.2,'#C9972B']])}
        <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--ink-muted-80)">
          ${[['특수학교','#7C879C'],['일반학교 특수학급','#63A8F5'],['일반학교 일반학급(완전통합)','#3FBF8F'],['특수교육지원센터','#C9972B']]
            .map(c=>`<span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${c[1]};margin-right:6px"></span>${c[0]}</span>`).join('')}
        </div>
        <div style="font-size:13px;color:var(--ink-muted-48);margin-top:12px;line-height:1.7">막대 길이는 학생 수 규모가 아닌 <b style="color:var(--ink-muted-80)">비율(%)</b>을 나타냅니다</div>
      </div>
    </div></div>`;

    /* ── 지표 탭 · 보기 기준 · 배치유형 필터 ── */
    const tabBtn = (lb, on, act) => `<div ${act?`onclick="${act}" `:''}style="flex:0 0 auto;padding:16px 30px;font-size:17px;font-weight:600;${act?'cursor:pointer;':''}
      color:${on?'var(--primary)':'var(--ink-muted-48)'};border-bottom:${on?'2px solid var(--primary)':'2px solid transparent'}">${lb}</div>`;
    const segBtn = (lb, on, act) => `<span ${act?`onclick="${act}" `:''}style="padding:8px 16px;border-radius:8px;font-size:14px;${act?'cursor:pointer;':''}
      background:${on?'var(--ink)':'transparent'};color:${on?'#fff':'var(--ink-muted-80)'}">${lb}</span>`;

    const tabsRowMK = (mk) => `<div style="display:flex;background:var(--canvas-parchment);border-bottom:1px solid var(--hairline)">
      ${tabBtn('학생 수', mk==='student', isBase ? `tvSet(this,'student',null)` : (mk==='student' ? '' : `tvGo('${REF['student|'+fix[1]]}')`))}
      ${tabBtn('기관 수', mk==='institution', isBase ? `tvSet(this,'institution',null)` : (mk==='institution' ? '' : (REF['institution|'+fix[1]] ? `tvGo('${REF['institution|'+fix[1]]}')` : `tvGo('trend:06','institution')`)))}</div>`;

    /* 오프라인 프로토타입의 안내 문구 규칙을 그대로 옮겼습니다 */
    const noteOf = (mk,vw,flt) => {
      if(vw==='type')
        return 'ⓘ 10개 장애유형을 유형별 독립 패널로 표시합니다 — 패널마다 세로축 눈금이 다릅니다 · 2008년은 정서장애에 자폐성장애가 포함되어 집계되었고(정서행동장애 7,681명), 발달지체는 2009년부터 조사되어 두 유형의 2008년 값은 \'미집계\'로 표시합니다';
      if(vw==='placement')
        return 'ⓘ 계열 간 규모 차이가 커 계열별 독립 패널로 표시합니다 — 패널마다 세로축 눈금이 다르니 값은 축·수치로 확인해 주세요 · 특수교육지원센터의 ' + (mk==='institution' ? '2008~2009년' : '2008년') + ' 값은 원자료에 없어 \'미집계\'로 표시합니다' + (mk==='institution' ? ' · 특수교육지원센터는 기관 수가 아닌 장애영아 학급 수(학급)입니다 · 특수학급 운영 학교와 일반학급 배치 학교는 서로 겹치는 학교가 있어, 패널 값을 더해도 전체 기관 수(공표 계)와 같지 않습니다' : '');
      if(vw!=='level') return mk==='institution' ? 'ⓘ 전체 기관 수는 특수교육통계 주요 현황 표의 공표 계(학교 및 센터 수)입니다 · 연도마다 산식이 달라 2008·2013·2015년은 표 아래 ※ 주석을 확인해 주세요 · 비교할 수 없는 연도의 전년 대비 증가율은 표시하지 않습니다' : '';
      let msg = 'ⓘ "장애영아"는 특수학교 장애영아 과정과 특수교육지원센터를 합산한 값입니다 · 2008년은 장애영아 구분이 없어 \'미집계\'로 표시합니다';
      if(mk==='institution') msg = 'ⓘ 이 값은 해당 과정을 설치한 학교 수로, 한 학교가 여러 과정을 함께 운영하면 과정마다 각각 계상되므로 더해서 쓰면 안 됩니다 · "장애영아"는 영아학급을 설치한 특수학교 수입니다(특수교육지원센터 장애영아 학급 수는 배치별에서 제공) · 2008년은 장애영아 구분이 없어 \'미집계\'로 표시합니다';
      return msg;
    };
    const segRowMK = (mk,vw,flt) => `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px 22px;text-align:left">
      <span style="font-size:14px;color:var(--ink-muted-48)">${mk==='student'?'학생 수':'기관 수'} <b style="color:var(--ink)">기준</b></span>
      <span style="display:inline-flex;background:var(--divider-soft);border-radius:10px;padding:3px;gap:2px">
        ${segBtn('계', vw==='total', vw==='total' ? '' : `tvGo('trend:06','${mk}')`)}
        ${segBtn('배치별', vw==='placement', vw==='placement' ? '' : `tvGo('${REF[mk+'|placement']}')`)}
        ${segBtn('급별', vw==='level', vw==='level' ? '' : `tvGo('${REF[mk+'|level']}')`)}
        ${mk==='student' ? segBtn('장애유형별', vw==='type', vw==='type' ? '' : `tvGo('${REF['student|type']}')`) : ''}</span>
      ${vw==='level' ? `<span style="display:inline-flex;background:var(--divider-soft);border-radius:10px;padding:3px;gap:2px">

        <div style="font-size:12px;color:var(--ink-muted-48);text-align:right;padding:6px 2px 14px">단위: 명(학생) / 개교(학교) · 학급(특수교육지원센터 장애영아 학급) · 개(전체 기관 수, 학교·센터 합계) · 그래프에 마우스를 올리면 연도별 수치를 볼 수 있습니다</div>
      </div></div>`; };

    /* ── 통계표 — 시계열 시각화 상세(sub_0103_상세)와 같은 표 서식 ── */
    const tableMK = (mk,vw,flt) => { const g=groupOf(mk,vw,flt); return `<div class="inner" style="padding:28px 0 8px;text-align:left">
      <h3 style="font-size:19px;font-weight:600;margin-bottom:14px">통계표</h3>
      <table class="tbl" style="margin-top:0;border-top:2px solid var(--ink);font-size:11.5px">
        <thead><tr><th style="padding:9px 8px">구분</th>${TY.map(y=>`<th class="c" style="border-left:1px solid var(--hairline);padding:9px 5px">${y}</th>`).join('')}</tr></thead>
        <tbody>${Object.keys(g).map(k=>`<tr><td style="font-weight:600;padding:9px 8px;white-space:nowrap">${k}</td>${g[k].map((v,ix)=>`<td class="c" style="border-left:1px solid var(--divider-soft);padding:9px 5px">${nf(v)}${mk==='institution' && vw==='total' && v!=null && TNOTE[TY[ix]] ? '※' : ''}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>${mk==='institution' && vw==='total' ? `<div style="font-size:12px;color:var(--ink-muted-48);line-height:1.7;margin-top:10px">${Object.keys(TNOTE).map(y=>`※ ${y}년: ${TNOTE[y]}`).join('<br>')}</div>` : ''}</div>`; };

    /* ── 각주 ── */
    const footNoteMK = (showLevel) => `<div class="inner" style="padding:26px 0 48px;text-align:left">
      <div style="font-size:13px;color:var(--ink-muted-48);line-height:1.8">
        출처: 교육부 국립특수교육원, 특수교육통계 (2008~2026년) — 행정통계 기준으로 실태조사 결과와 집계 대상·시점이 다를 수 있습니다. 전체 기관 수는 각 연도 통계집 주요 현황 표의 공표 계를 그대로 표기했습니다.

    const box = (pos, html) => `<div class="inner"${pos==='t'?' style="padding:28px 0 0"':''}>

        ? 'border-radius:var(--r-lg) var(--r-lg) 0 0;border-bottom:0'
        : 'border-radius:0 0 var(--r-lg) var(--r-lg)'};overflow:hidden;background:var(--canvas)">${html}</div></div>`;

    /* ══ 하위 화면(배치별·급별) ══ */
    if(!isBase){
      const [mk, vw] = fix;
      const cmn = {h:640, html:`<!-- 공통 영역 · 페이지 헤더·숫자로 보는 특수교육 참조 (sub_0102 에서 정의, 번호 미부여) -->
          <div class="mk" style="opacity:.55">${pageHeadMK()}${heroTrendMK()}</div>`};

      if(vw === 'level'){
        /* 배치유형 필터 4종을 미리 그려 두고 선택한 것만 보여 줍니다 */
        const fp = fn => FLT.map(([lb,key],i)=>
          `<div data-pane="flt|${key}"${i===0?'':' style="display:none"'}>${fn(key)}</div>`).join('');
        return [

          ${R('01','',box('t', tabsRowMK(mk)))}
          ${R('01','',box('b', segRowMK(mk,vw,'전체')))}
        </div>`},
        {h:500, html:`<div class="mk">${R('02','',chartCardMK(mk,vw,'전체'))}</div>`},
        {h:vw==='type'?420:230, html:`<div class="mk">${R('03','',tableMK(mk,vw,'전체'))}</div>`},
        {h:180, html:`<div class="mk">${R('04','',footNoteMK(vw==='type'))}</div>`},
        {h:200, html:subFooterRibbon()}
      ];
    }

    /* ══ 본 화면(sub_0102) — 계 기준, 지표 탭만 그 자리에서 전환 ══ */
    const pane = (mk,html) => `<div data-pane="${mk}|total"${mk==='student'?'':' style="display:none"'}>${html}</div>`;

      {h:640, html:`<div class="mk">${R('03','',`<div class="inner" style="padding:28px 0;text-align:left">

      {h:420, html:`<div class="mk">${R('05','',`<div class="inner" style="padding:0 0 0;text-align:left">

          <tbody>${TABLE_T.map(r=>`<tr><td style="font-weight:600">${r.label}</td>${r.vals.map(v=>`<td style="text-align:center;border-left:1px solid var(--divider-soft)">${v}</td>`).join('')}</tr>`).join('')}</tbody>

        <h3 style="font-size:16px;font-weight:600;margin:20px 0 10px">지표정보</h3>
        <div style="font-size:13px;color:var(--ink-muted-48);line-height:1.7">
          조사대상 보호자 · 2023년 모집단 104,087명<br>

          ※ 가중치 적용으로 소수점에 의해 합계 등의 수치가 일치하지 않을 수 있습니다.<br>
          출처 : 국립특수교육원 특수교육 실태조사(국가승인통계 제112014호)
        </div></div>`)}</div>`},

      {h:300, html:`<div class="mk">${R('07','',`<div class="inner" style="padding:24px 0 32px;text-align:left;border-top:1px solid var(--hairline)">
        <h3 style="font-size:17px;font-weight:600;margin-bottom:16px">용어해설</h3>
        ${glossaryHTML_T()}
        <div style="margin-top:16px;font-size:12.5px;color:var(--ink-muted-48)">출처 : 국가통계포털(KOSIS) 통계설명자료 · 국가승인통계 제112014호 주요 용어해설</div></div>`)}</div>`},

      {h:210, html:aiFabMK('08')},

      {h:720, html:aiPanelMK({panel:'09', scope:'10'}, state, {
        suggest:['가장 많은 시기는 뭐예요?',
                 '유치원 5세반은 몇 %예요?',
                 '선정·배치가 뭐예요?'],
        ask:'가장 많은 시기는 뭐예요?',
        answer:'가장 많은 시기는 <b>초등학교 1학년</b>이에요.<br>25.6%예요.<br>100명 중 약 26명이에요.'
      })},

      {h:250, html:subFooterRibbon()}
    ];
  }

  /* ── 목업 미작성 화면 (안전망) ── */
  return [
    {h:120, html:`<div class="mk"><div class="inner" style="padding:40px 0 8px">
        <div style="font-size:30px;font-weight:600;letter-spacing:.196px">${menu.name}</div>
        <div style="font-size:16px;color:var(--ink-muted-48);margin-top:8px">목업 미작성 — 항목 ${menu.items.length}개</div>
      </div></div>`},
    ...menu.items.map(it=>({h:110, html:`<div class="mk"><div class="inner" style="padding:8px 0">
        ${R(it.no,'',`<div style="padding-top:30px;border:1px dashed var(--chip-translucent);border-radius:var(--r-lg);
          padding-left:24px;padding-right:24px;padding-bottom:24px;background:var(--surface-pearl);text-align:left">
          <div style="font-size:19px;font-weight:600">${it.title}</div>
          <div style="font-size:16px;color:var(--ink-muted-48);margin-top:8px">
            ${it.desc && it.desc.length ? it.desc[0] : '설명 미작성'}</div>
        </div>`)}
      </div></div>`}))
