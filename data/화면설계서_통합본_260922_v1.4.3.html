}

/* 프론트 식별자는 저장하지 않고 화면번호+항목번호에서 만들어 씁니다 */
const feId = (m, no) => `${m.screenNo}-${no}`;

/* 항목 버전도 저장하지 않습니다. history 에서 계산합니다.
   history 는 최신순이므로, 그 항목을 처음 언급하는 버전이 곧 최종 수정 버전입니다. */
function itemVer(menuId, no){
  for(const h of SCREEN_SPEC.history){
    if(h.items.includes(`${menuId}:${no}`) || h.items.includes(`${menuId}:전체`)) return h.ver;
  }
  return SCREEN_SPEC.history[SCREEN_SPEC.history.length-1].ver;
}

/* 고객에게 아직 보내지 않은 단계인가 — 버전·상태·배지 표기를 모두 이 값이 결정합니다 */
function isInternal(){ return (SCREEN_SPEC.meta.stage || 'internal') === 'internal'; }
const FIRST_VER = 'v1.0';

const beIndex = (()=>{
  const idx = {};
  SCREEN_SPEC.menus.forEach(m => m.items.forEach(it=>{
    if(!it.be) return;
    (idx[it.be] = idx[it.be] || []).push({
      menuId:m.id, screenNo:m.screenNo, screen:m.label,
      no:it.no, title:it.title, fe:feId(m, it.no),
      api:it.api, ver:itemVer(m.id, it.no), status:it.status
    });
  }));
  return idx;
})();

const LOC_WORDS = ['상단','하단','좌측','우측','왼쪽','오른쪽','위치','상단에','아래에'];

function checkDoc(scope){
  const F = [];
  const add = (lv, ref, loc, msg) => F.push({lv, ref, loc, msg});
  const menus = scope ? [SCREEN_SPEC.menus[curMenu]] : SCREEN_SPEC.menus;
  const allScreenNos = SCREEN_SPEC.menus.map(m=>m.screenNo);
  const internal = isInternal();
  const firstRef = `${SCREEN_SPEC.menus[0].id}:${SCREEN_SPEC.menus[0].items[0].no}`;

  /* 납품 단계 규칙 — 고객에게 보내기 전에는 버전도 상태도 움직이지 않습니다 */
  if(!['internal','delivered'].includes(SCREEN_SPEC.meta.stage || 'internal'))
    add('err', firstRef, '문서', `meta.stage 가 "${SCREEN_SPEC.meta.stage}" — internal 또는 delivered 만 됩니다`);
  if(internal && !scope){
    if(SCREEN_SPEC.meta.version !== FIRST_VER)
      add('err', firstRef, '문서',
          `고객 전달 전(stage:internal)인데 버전이 ${SCREEN_SPEC.meta.version} — ${FIRST_VER} 로 되돌리세요`);
    if(SCREEN_SPEC.history.length > 1)
      add('err', firstRef, '문서',
          `고객 전달 전인데 변경이력이 ${SCREEN_SPEC.history.length}건 — 사내 수정은 이력을 남기지 않고 ${FIRST_VER} 한 줄로 둡니다`);
    if(SCREEN_SPEC.history[0] && SCREEN_SPEC.history[0].ver !== FIRST_VER)
      add('err', firstRef, '문서', `변경이력 첫 줄의 버전이 ${FIRST_VER} 이 아닙니다`);
  }

  menus.forEach(m=>{
    const code = n => `${m.screenNo}-${n}`;

    /* 화면 단위 */
    if(m.items.length > 15)
      add('err', `${m.id}:${m.items[0].no}`, m.screenNo, `항목 ${m.items.length}개 — 15개를 넘었습니다. 화면을 나누세요`);
    if(!m.states.some(st=>st.id==='default'))
      add('err', `${m.id}:${m.items[0].no}`, m.screenNo, `기본(default) 상태가 없습니다`);

    /* 화면 종류(kind) — 메인은 화면 요소 단위, 서브는 화면의 구획 단위로 번호를 매깁니다 */
    const kind = m.kind || 'main';
    if(!['main','sub'].includes(kind))
      add('err', `${m.id}:${m.items[0].no}`, m.screenNo, `kind 가 "${kind}" — main 또는 sub 만 됩니다`);
    if(kind === 'sub'){
      if(!m.crumb)
        add('warn', `${m.id}:${m.items[0].no}`, m.screenNo,
            `서브 화면인데 crumb 이 없습니다 — 1차·2차 메뉴 위치를 메뉴 구조에 맞춰 적으세요`);
      if(m.items.length > 8)
        add('warn', `${m.id}:${m.items[0].no}`, m.screenNo,
            `서브 화면 항목 ${m.items.length}개 — 화면의 구획(섹션) 단위로 묶으세요`);
      try{
        if(!/공통 영역/.test(buildSections(m,'default').map(x=>x.html).join('')))
          add('warn', `${m.id}:${m.items[0].no}`, m.screenNo,
              `서브 화면인데 공통 영역(헤더·GNB·푸터) 표시가 없습니다`);
      }catch(e){}
    }

    const ext = m.items.filter(i=>i.data||i.logic||i.api).length;
    if(ext > m.items.length/2)
      add('warn', `${m.id}:${m.items[0].no}`, m.screenNo,
          `심화 줄이 ${ext}/${m.items.length}개 — 절반을 넘었습니다. 정말 필요한 것만 남기세요`);

    /* 목업 ↔ 정의 번호 대조 */
    let mockIds = [];
    try{
      const html = buildSections(m, 'default').map(x=>x.html).join('');
      mockIds = [...new Set((html.match(/data-spec-id="(\d+)"/g)||[]).map(x=>x.slice(14,-1)))];
    }catch(e){
      add('err', `${m.id}:${m.items[0].no}`, m.screenNo, `목업 렌더 오류: ${e.message}`);
    }
    const defIds = m.items.map(i=>i.no);
    defIds.filter(n=>!mockIds.includes(n)).forEach(n=>
      add('err', `${m.id}:${n}`, code(n), `정의만 있고 목업에 영역이 없습니다`));
    mockIds.filter(n=>!defIds.includes(n)).forEach(n=>
      add('err', `${m.id}:${defIds[0]}`, `${m.screenNo}-${n}`, `목업에만 있고 정의가 없습니다`));

    /* 항목 단위 */
    m.items.forEach(it=>{
      const ref = `${m.id}:${it.no}`, loc = code(it.no);

      if(!it.desc || !it.desc.length)
        add('err', ref, loc, `설명이 비어 있습니다`);
      else{
        if(it.desc.length > 4) add('err', ref, loc, `불릿 ${it.desc.length}개 — 4개를 넘었습니다`);
        it.desc.forEach(d=>{
          if(d.length > 40) add('err', ref, loc, `${d.length}자 — 40자를 넘었습니다: "${d.slice(0,18)}…"`);
          const w = LOC_WORDS.find(x=>d.includes(x));
          if(w) add('err', ref, loc, `위치 설명 "${w}" — 번호 배지가 대신합니다`);
        });
      }

      (it.logic||[]).forEach(l=>{
        if(!m.states.some(st=>st.id===l.stateId))
          add('err', ref, loc, `분기의 상태 "${l.stateId}" 가 states 에 없습니다`);
      });

      const link = it.linkTo || (it.desc||[]).join(' ').match(/\(([A-Z]+_\d+)\)/)?.[1];
      if(link && !allScreenNos.includes(link))
        add('info', ref, loc, `${link} 화면이 아직 이 문서에 없습니다`);

      if(internal){
        /* 고객이 아직 본 적이 없으므로 확정된 항목이 있을 수 없습니다 */
        if(it.status !== 'tbd')
          add('err', ref, loc,
              `고객 전달 전인데 상태가 "${it.status}" — 1차 전달 전에는 전 항목이 미확정(tbd)입니다`);
      }else if(it.status !== 'confirmed' && !(it.issues||[]).length){
        add('warn', ref, loc, `${it.status === 'tbd' ? '미확정' : '검토중'} 인데 논의 내용이 없습니다`);
      }

      const inHist = SCREEN_SPEC.history.some(h=>
        h.items.includes(ref) || h.items.includes(`${m.id}:전체`));
      if(!inHist) add('warn', ref, loc, `변경이력에 없습니다 — 어느 버전에서 만든 항목인지 적으세요`);

      if(it.be && !it.api){
        const kin = beIndex[it.be].filter(r=>r.api).length;
        if(!kin) add('warn', ref, loc, `${it.be} 를 쓰는데 엔드포인트가 어디에도 없습니다`);
      }
    });
  });

  const order = {err:0, warn:1, info:2};
  return F.sort((a,b)=>order[a.lv]-order[b.lv]);
}

/* 파급 — 이 화면을 고칠 때 함께 봐야 할 곳 */
function impactOf(m){
  const out = [];
  m.items.forEach(it=>{
    if(!it.be) return;
    beIndex[it.be].filter(r=>r.menuId !== m.id).forEach(r=>
      out.push({ref:`${r.menuId}:${r.no}`, loc:`${r.screenNo}-${r.no}`,
        msg:`${it.no} ${it.title} 와 같은 기능(${it.be})을 씁니다 — 응답 규격을 바꾸면 함께 확인`}));
  });
  SCREEN_SPEC.menus.filter(x=>x.id!==m.id).forEach(x=>x.items.forEach(it=>{
    if(it.linkTo === m.screenNo)
      out.push({ref:`${x.id}:${it.no}`, loc:`${x.screenNo}-${it.no}`,
        msg:`이 화면으로 이동하는 항목입니다 — 화면번호나 진입 조건을 바꾸면 함께 확인`});
  }));
  return out;
}

/* ##DATA_END## — 여기까지가 화면(DOM)에 의존하지 않는 데이터 계층입니다.
   scripts/check.js 가 이 구간만 떼어내 규칙 검사를 돌립니다. */

/* ═══════════════════════════════════════════════════════════════════
   렌더링
   ═══════════════════════════════════════════════════════════════════ */
let curMenu = 0, curState = 'default', cols = 1, showBadge = true, tbdOnly = false, pinned = null;

const $ = s => document.querySelector(s);

function scaleCanvas(){
  const s = Math.min(window.innerWidth/1600, window.innerHeight/900);
  $('#canvas').style.transform = `scale(${s})`;
}
window.addEventListener('resize', scaleCanvas);

/* 화면 선택 — 메인페이지 / 서브 페이지 두 묶음으로 접고, 누르면 목록이 펼쳐집니다.
   묶음 기준은 각 화면의 kind('main' / 'sub') 이고, 지금 보고 있는 화면 이름을
   묶음 버튼에 함께 적어 어디에 있는지 알 수 있게 합니다. */
function renderMenuSeg(){
  const cur = SCREEN_SPEC.menus[curMenu];
  const groups = [{key:'main', label:'메인페이지'}, {key:'sub', label:'서브 페이지'}];
  $('#menuSeg').innerHTML = groups.map(g=>{
    const rows = SCREEN_SPEC.menus.map((m,i)=>({m,i})).filter(r=>(r.m.kind||'main')===g.key);
    if(!rows.length) return '';
    const on = rows.some(r=>r.i===curMenu);
    return `<div class="mgrp" data-grp="${g.key}">
      <button aria-pressed="${on}" onclick="toggleMenuGrp('${g.key}',event)">${g.label}${
        on ? ` <span class="cv">· ${cur.label}</span>` : ''} ▾</button>
      <div class="mdrop">${rows.map(r=>
        `<a class="${r.i===curMenu?'sel':''}" onclick="switchMenu(${r.i})">${r.m.label}</a>`).join('')}</div>
    </div>`;
  }).join('');
}

function toggleMenuGrp(key, ev){
  if(ev) ev.stopPropagation();
  const seg = $('#menuSeg');
  const t = seg.querySelector(`.mgrp[data-grp="${key}"]`);
  const was = t.classList.contains('open');
  seg.querySelectorAll('.mgrp').forEach(g=>g.classList.remove('open'));
  if(!was) t.classList.add('open');
}

/* 바깥을 누르면 닫습니다. 화면을 바꾸면 renderMenuSeg 가 다시 그려져 자동으로 닫힙니다 */
document.addEventListener('click', ()=>{
  document.querySelectorAll('#menuSeg .mgrp.open').forEach(g=>g.classList.remove('open'));
});
function switchMenu(i){
  curMenu = i; curState = 'default'; pinned = null;
  cols = SCREEN_SPEC.menus[i].columns;
  renderAll();
}
function switchState(id){ curState = id; renderUI(); renderStateBar(); }

function renderStateBar(){
  const m = SCREEN_SPEC.menus[curMenu];
  $('#stateBar').innerHTML = m.states.map(s=>
    `<button class="st" aria-pressed="${s.id===curState}" onclick="switchState('${s.id}')">${s.label}</button>`).join(' ');
}

/* 화면 UI — 섹션을 컬럼에 균등 배분한 뒤 컬럼 폭에 맞춰 축소 */
function renderUI(){
  const m = SCREEN_SPEC.menus[curMenu];
  const secs = buildSections(m, curState);
  const total = secs.reduce((a,s)=>a+s.h, 0);
  const target = total / cols;

  const buckets = Array.from({length:cols}, ()=>[]);
  let ci = 0, acc = 0;
  secs.forEach(s=>{
    if(ci < cols-1 && acc + s.h/2 > target){ ci++; acc = 0; }
    buckets[ci].push(s); acc += s.h;
  });

  const stage = $('#uiStage');
  const gap = 16;
  const avail = stage.clientWidth - 34; /* padding 17*2 */
  const colW = (avail - gap*(cols-1)) / cols;
  const scale = colW / MOCK_W;

  stage.innerHTML = `<div class="cols">${buckets.map((b,i)=>`
    <div class="col">
      ${cols>1 ? `<div class="col-cap">${i+1}단</div>` : ''}
      <div class="scaler" style="width:${MOCK_W}px;transform:scale(${scale});--inv:${1/scale};
           margin-bottom:${-(b.reduce((a,s)=>a+s.h,0))*(1-scale)}px">
        ${b.map(s=>s.html).join('')}
      </div>
    </div>`).join('')}</div>`;

  bindRegions();
  applyFilters();
}

/* 디스크립션 카드 — 화면 패널과 인쇄본이 같은 마크업을 씁니다 */
function specCardsHtml(m){
  return m.items.map(it=>{
    const tag = it.status === 'tbd' ? `<span class="tag tbd">미확정</span>`
              : it.status === 'review' ? `<span class="tag review">검토중</span>` : '';
    const bullets = it.desc.map(d=>{
      const html = d.replace(/\(([A-Z]+_\d+)\)/g, '(<span class="link">$1</span>)');
      return `<li>${html}</li>`;
    }).join('');

    let ext = '';
    if(it.data){
      ext += `<div class="ext"><span class="lb">데이터</span><div class="bd">
        <table>${it.data.map(d=>`<tr><td>${d.field}</td><td>${d.spec}</td><td>${d.note||''}</td></tr>`).join('')}</table>
        ${it.dataNote ? `<div class="note">${it.dataNote}</div>` : ''}</div></div>`;
    }
    if(it.logic){
      ext += `<div class="ext"><span class="lb">분기</span><div class="bd">
        ${it.logic.map(l=>`<div class="row" onclick="switchState('${l.stateId}')">${l.when} → ${l.then}</div>`).join('')}
      </div></div>`;
    }
    if(it.api){
      ext += `<div class="ext"><span class="lb">API</span><div class="bd">
        <code>${it.api.line}</code><div>${it.api.res}</div>
        <div>${it.api.errors}</div><div class="note">${it.api.calledOn}</div></div></div>`;
    }
    if(it.refs && it.refs.length){
      ext += `<div class="ext"><span class="lb">참고</span><div class="bd">
        ${it.refs.map(r=>`<div class="note" style="margin-bottom:8px;line-height:1.6">${r}</div>`).join('')}
      </div></div>`;
    }
    const iss = it.issues && it.issues.length
      ? `<details class="iss"><summary>💬 논의 ${it.issues.length}건</summary>
         ${it.issues.map(i=>`<p><b>${i.by}</b> ${i.date} — ${i.text}</p>`).join('')}</details>` : '';

    const peers = it.be
      ? beIndex[it.be].filter(r => !(r.menuId === m.id && r.no === it.no)) : [];
    const shared = peers.length > 0;
    const ver = itemVer(m.id, it.no);
    const isNow = ver === SCREEN_SPEC.meta.version && !isInternal();
    const idrow = `<div class="idrow">
      <span class="idc" title="화면번호-항목번호가 곧 프론트 식별자입니다">${feId(m, it.no)}</span>
      ${it.be
        ? `<span class="idc be${shared?' shared':''}" data-be="${it.be}"
             title="${shared ? '눌러서 매칭표 보기 · '+(peers.length+1)+'개 항목이 함께 씁니다' : '눌러서 매칭표 보기'}">${it.be}</span>`
        : `<span class="idc none">백엔드 연동 없음</span>`}
      ${peers.map(r=>`<span class="idc jump" data-ref="${r.menuId}:${r.no}"
          title="${r.screenNo}-${r.no} · ${r.title} 로 이동">⇄ ${r.screen} ${r.no}</span>`).join('')}
      <span class="vc${isNow ? ' now' : ''}">${ver}${isNow ? ' 변경' : ''}</span>
    </div>`;

    return `<div class="spec" data-spec-id="${it.no}" data-status="${it.status}"
                 data-ver="${ver}" data-be="${it.be || ''}">
      <div class="spec-h"><span class="n">${it.no}</span><span class="t">${it.title}</span>${tag}</div>
      ${idrow}
      <ul>${bullets}</ul>${ext}${iss}
    </div>`;
  }).join('');
}

/* 디스크립션 패널 — 접이식/탭 없이 전부 노출 */
function renderPanel(){
  const m = SCREEN_SPEC.menus[curMenu];
  $('#screenNo').textContent = m.screenNo;
  $('#panelTitle').textContent = m.name;
  $('#panelMeta').textContent = `${SCREEN_SPEC.meta.version} · ${SCREEN_SPEC.meta.date} · 항목 ${m.items.length}`;

  $('#panelList').innerHTML = specCardsHtml(m);

  bindSpecs();
  document.querySelectorAll('.idc.jump').forEach(el=>{
    el.addEventListener('click', e=>{ e.stopPropagation(); gotoRef(el.dataset.ref, true); });
  });
  document.querySelectorAll('.idc.be').forEach(el=>{
    el.addEventListener('click', e=>{ e.stopPropagation(); openMtx(el.dataset.be); });
    el.addEventListener('mouseenter', ()=>markLinked(el.dataset.be));
    el.addEventListener('mouseleave', ()=>markLinked(null));
  });
}

/* 같은 백엔드 기능을 쓰는 항목을 함께 표시합니다 */
function markLinked(be){
  document.querySelectorAll('.spec.linked').forEach(e=>e.classList.remove('linked'));
  if(!be) return;
  document.querySelectorAll(`.spec[data-be="${be}"]`).forEach(e=>e.classList.add('linked'));
}

/* 번호 매칭 : 좌우 상호 하이라이트 + 클릭 고정 */
function setActive(id){
  document.querySelectorAll('.rgn.on, .spec.on').forEach(e=>e.classList.remove('on'));
  if(!id) return;
  document.querySelectorAll(`.rgn[data-spec-id="${id}"]`).forEach(e=>e.classList.add('on'));
  const s = document.querySelector(`.spec[data-spec-id="${id}"]`);
  if(s){ s.classList.add('on'); s.scrollIntoView({block:'nearest', behavior:'smooth'}); }
}
function hoverIn(id){ if(!pinned) setActive(id); }
function hoverOut(){ if(!pinned) setActive(null); }
function togglePin(id){ pinned = (pinned === id) ? null : id; setActive(pinned || id); }

function bindRegions(){
  document.querySelectorAll('.rgn').forEach(el=>{
    const id = el.dataset.specId;
    el.addEventListener('mouseenter', e=>{ e.stopPropagation(); hoverIn(id); });
    el.addEventListener('mouseleave', hoverOut);
    el.addEventListener('click', e=>{ e.stopPropagation(); togglePin(id); });
  });
}
function bindSpecs(){
  document.querySelectorAll('.spec').forEach(el=>{
    const id = el.dataset.specId;
    el.addEventListener('mouseenter', ()=>hoverIn(id));
    el.addEventListener('mouseleave', hoverOut);
    el.addEventListener('click', e=>{ if(e.target.closest('.row,summary')) return; togglePin(id); });
  });
}

/* 토글 3종 */
function applyFilters(){
  $('#canvas').classList.toggle('nobadge', !showBadge);
  const m = SCREEN_SPEC.menus[curMenu];
  const keep = new Set(m.items.filter(i=>
    (!tbdOnly || i.status !== 'confirmed') &&
    (!verOnly || itemVer(m.id, i.no) === SCREEN_SPEC.meta.version)
  ).map(i=>i.no));
  const on = tbdOnly || verOnly;
  document.querySelectorAll('.spec').forEach(e=>
    e.classList.toggle('dim', on && !keep.has(e.dataset.specId)));
  document.querySelectorAll('.rgn').forEach(e=>
    e.classList.toggle('dim', on && !keep.has(e.dataset.specId)));
}

$('#tgBadge').onclick = e => { showBadge = !showBadge; e.target.setAttribute('aria-pressed', showBadge); applyFilters(); };
$('#tgTbd').onclick   = e => { tbdOnly = !tbdOnly;   e.target.setAttribute('aria-pressed', tbdOnly);   applyFilters(); };
$('#tgCol').onclick   = e => { cols = cols % 3 + 1;  e.target.textContent = '단 ' + cols; renderUI(); };





/* ═══════════════════════════════════════════════════════════════════
   작성 점검 — 툴바 [점검]
   ① 작성 순서 5단계가 어디까지 왔는지
   ② 규칙 위반과 빠진 곳
   ③ 이 화면을 고칠 때 함께 봐야 할 곳(파급)
   규칙을 문서로 적어두면 안 지켜지므로 여기서 자동으로 잡습니다.
   ═══════════════════════════════════════════════════════════════════ */
function openChk(){
  const m = SCREEN_SPEC.menus[curMenu];
  const F = checkDoc(false);
  const err = F.filter(f=>f.lv==='err').length, warn = F.filter(f=>f.lv==='warn').length;
  $('#chkSub').textContent = `전체 ${SCREEN_SPEC.menus.length}화면 · 오류 ${err} · 경고 ${warn} · 현재 ${m.screenNo}`;

  /* ① 작성 순서 5단계 진행 */
  const steps = [
    ['항목 목록', m.items.length > 0 && m.items.length <= 15,
     `번호와 이름만. 15개를 넘으면 화면을 나눕니다`, `${m.items.length}개`],
    ['상태 목록', m.states.length > 1,
     `목업보다 먼저 정합니다. 나중에 추가하면 목업을 다시 짭니다`, `${m.states.length}종`],
    ['설명 3줄', m.items.every(i=>i.desc && i.desc.length),
     `보임 → 동작 → 등록경로. 막히면 tbd 로 남기고 넘어갑니다`,
     `${m.items.filter(i=>i.desc&&i.desc.length).length}/${m.items.length}`],
    ['심화 줄', m.items.filter(i=>i.data||i.logic||i.api).length <= m.items.length/2,
     `두 테스트를 통과한 것만. 절반을 넘으면 과합니다`,
     `${m.items.filter(i=>i.data||i.logic||i.api).length}/${m.items.length}`],
    ['목업 마크업', (()=>{ try{
        const h = buildSections(m,'default').map(x=>x.html).join('');
        const ids = new Set((h.match(/data-spec-id="(\d+)"/g)||[]).map(x=>x.slice(14,-1)));
        return m.items.every(i=>ids.has(i.no));
      }catch(e){ return false; } })(),
     `마지막에 그립니다. 가장 비싸고 정보량은 가장 적습니다`, `states ${m.states.length}종`]
  ];

  const imp = impactOf(m);

  $('#chkBody').innerHTML = `
    <h4>작성 순서 — ${m.label}</h4>
    ${steps.map(([t,ok,d,c],i)=>`
      <div class="step">
        <span class="k ${ok?'ok':'no'}">${ok?'✓':i+1}</span>
        <span class="tt">${t}<div class="d">${d}</div></span>
        <span class="cnt">${c}</span>
      </div>`).join('')}

    <h4>점검 결과 — 전체 화면</h4>
    ${F.length ? F.map(f=>`
      <div class="f" data-ref="${f.ref}">
        <span class="lv ${f.lv}">${f.lv==='err'?'오류':f.lv==='warn'?'경고':'참고'}</span>
        <span class="loc">${f.loc}</span><span class="msg">${f.msg}</span>
      </div>`).join('')
      : `<div class="pass">✓ 규칙 위반이 없습니다</div>`}

    <h4>이 화면을 고칠 때 함께 볼 곳 — ${m.label}</h4>
    ${imp.length ? imp.map(f=>`
      <div class="f" data-ref="${f.ref}">
        <span class="lv info">파급</span>
        <span class="loc">${f.loc}</span><span class="msg">${f.msg}</span>
      </div>`).join('')
      : `<div class="pass" style="color:var(--ink-muted-48)">다른 화면과 얽힌 곳이 없습니다</div>`}

    <div class="note">
      줄을 누르면 해당 항목으로 이동합니다.<br>
      오류는 규칙 위반이라 반드시 고쳐야 하고, 경고는 빠졌을 가능성이 높은 곳,
      참고는 아직 만들지 않은 화면을 가리킵니다.
    </div>`;

  $('#chkBody').querySelectorAll('.f').forEach(el=>
    el.addEventListener('click', ()=>gotoRef(el.dataset.ref, true)));
  $('#chk').classList.add('open');
}
function closeChk(){ $('#chk').classList.remove('open'); }
$('#tgChk').onclick = openChk;
$('#chk').addEventListener('click', e=>{ if(e.target.id === 'chk') closeChk(); });

/* ═══════════════════════════════════════════════════════════════════
   변경이력 — 툴바 [변경이력] 으로 엽니다.
   영향 항목 칩을 누르면 그 화면으로 이동해 해당 항목을 고정 표시합니다.
   history[].items 는 '화면id:번호' 또는 '화면id:전체' 로 적습니다.
   ═══════════════════════════════════════════════════════════════════ */
function itemLabel(ref){
  const [mid, no] = ref.split(':');
  const m = SCREEN_SPEC.menus.find(x=>x.id===mid);
  if(!m) return ref;
  if(no === '전체') return `${m.label} 전체`;
  const it = m.items.find(i=>i.no===no);
  return `${m.label} ${no} ${it ? it.title : ''}`.trim();
}
/* 칩 툴팁에는 코드 형태의 식별자를 붙여 개발자도 바로 찾을 수 있게 합니다 */
function itemCode(ref){
  const [mid, no] = ref.split(':');
  const m = SCREEN_SPEC.menus.find(x=>x.id===mid);
  return m ? (no === '전체' ? m.screenNo : `${m.screenNo}-${no}`) : ref;
}

/* 화면 사이 이동 — 어디서 왔는지 기억해 [← 돌아가기] 로 되돌립니다 */
let navStack = [];

function gotoRef(ref, remember){
  const [mid, no] = ref.split(':');
  const i = SCREEN_SPEC.menus.findIndex(x=>x.id===mid);
  if(i < 0) return;
  if(remember) navStack.push({menu:curMenu, pin:pinned, state:curState});
  closeHist(); closeMtx();
  if(i !== curMenu){ curMenu = i; cols = SCREEN_SPEC.menus[i].columns; curState = 'default'; }
  pinned = (no === '전체') ? null : no;
  renderAll();
  if(no !== '전체'){
    setActive(no);
    const el = document.querySelector(`.spec[data-spec-id="${no}"]`);
    if(el){ el.classList.add('arrived'); setTimeout(()=>el.classList.remove('arrived'), 1700); }
  }
}

function goBack(){
  const prev = navStack.pop();
  if(!prev) return;
  curMenu = prev.menu; cols = SCREEN_SPEC.menus[prev.menu].columns;
  curState = prev.state; pinned = prev.pin;
  renderAll();
  if(prev.pin) setActive(prev.pin);
}

function openHist(){
  const cur = SCREEN_SPEC.meta.version;
  const changed = SCREEN_SPEC.menus.reduce((a,m)=>a + m.items.filter(i=>itemVer(m.id,i.no)===cur).length, 0);
  $('#histSub').textContent =
    `${SCREEN_SPEC.history.length}개 버전 · 현재 ${cur} · 이번 변경 ${changed}개 항목`;

  $('#histBody').innerHTML = SCREEN_SPEC.history.map(h=>`
    <div class="row${h.ver===cur?' now':''}">
      <div class="vv">${h.ver}<div class="d">${h.date}</div></div>
      <div class="cc">
        <div class="ch">${h.change}</div>
        <div class="by">작성 ${h.by}</div>
        <div class="chips">${h.items.map(ref=>{
          const all = ref.endsWith(':전체');
          return `<span class="chip${all?' all':''}" data-ref="${ref}" title="${itemCode(ref)}">${itemLabel(ref)}</span>`;
        }).join('')}</div>
      </div>
    </div>`).join('') + `
    <div class="foot">
      항목 칩을 누르면 해당 화면으로 이동해 그 항목을 고정 표시합니다.
      항목별 최종 수정 버전은 디스크립션의 식별번호 줄 오른쪽에서 확인할 수 있습니다.
    </div>`;

  $('#histBody').querySelectorAll('.chip').forEach(el=>
    el.addEventListener('click', ()=>gotoRef(el.dataset.ref, true)));
  $('#hist').classList.add('open');
}
function closeHist(){ $('#hist').classList.remove('open'); }
$('#tgHist').onclick = openHist;
$('#btnBack').onclick = goBack;
$('#hist').addEventListener('click', e=>{ if(e.target.id === 'hist') closeHist(); });

/* ═══════════════════════════════════════════════════════════════════
   백엔드 식별번호 색인 — 화면이 달라도 같은 BE ID면 같은 기능입니다.
   여러 화면이 공유하는 기능은 ⇄ 로 표시되고, 클릭하면 매칭표가 열립니다.
   ═══════════════════════════════════════════════════════════════════ */
function openMtx(focusBe){
  const keys = Object.keys(beIndex).sort();
  const shared = keys.filter(k=>beIndex[k].length>1).length;
  $('#mtxSub').textContent =
    `백엔드 기능 ${keys.length}건 · 화면 공유 ${shared}건 · 문서 ${SCREEN_SPEC.meta.version}`;

  $('#mtxBody').innerHTML = `<table>
    <thead><tr>
      <th style="width:118px">백엔드 기능</th><th style="width:128px">프론트 식별자</th>
      <th style="width:128px">화면</th><th>항목</th>
      <th style="width:280px">엔드포인트</th><th style="width:52px">버전</th>
    </tr></thead><tbody>
    ${keys.map(be=>{
      const rows = beIndex[be];
      const multi = rows.length > 1;
      return rows.map((r,i)=>`
        <tr data-ref="${r.menuId}:${r.no}"${focusBe===be?' style="background:rgba(0,102,204,.07)"':''}>
          ${i===0 ? `<td rowspan="${rows.length}" class="mono be">${be}
              ${multi?`<div class="warn" style="font-size:10px;font-weight:400;margin-top:3px">${rows.length}개 화면 공유 ⇄</div>`:''}</td>` : ''}
          <td class="mono">${r.fe}</td>
          <td>${r.screen}</td>
          <td>${r.no} ${r.title}</td>
          <td class="mono">${r.api ? r.api.line.split(' · ')[0] : '<span style="color:var(--chip-translucent)">상위 항목 응답 사용</span>'}</td>
          <td class="mono">${r.ver}</td>
        </tr>`).join('');
    }).join('')}
    </tbody></table>
    <div style="font-size:11px;color:var(--ink-muted-48);margin-top:14px;line-height:1.6">
      행을 누르면 그 화면의 항목으로 이동합니다. 이동 후에는 [← 돌아가기] 로 되돌아올 수 있습니다.<br>
      ⇄ 표시는 여러 항목이 같은 백엔드 기능을 쓴다는 뜻입니다.
      이 기능의 응답 규격을 바꾸면 표에 함께 적힌 화면을 모두 확인해야 합니다.
    </div>`;
  $('#mtxBody').querySelectorAll('tr[data-ref]').forEach(tr=>
    tr.addEventListener('click', ()=>gotoRef(tr.dataset.ref, true)));
  $('#mtx').classList.add('open');
}
function closeMtx(){ $('#mtx').classList.remove('open'); }
$('#tgMtx').onclick = ()=>openMtx(null);
$('#mtx').addEventListener('click', e=>{ if(e.target.id === 'mtx') closeMtx(); });

/* 이번 변경분만 보기 — meta.version 과 같은 ver 을 가진 항목만 남깁니다 */
let verOnly = false;
$('#tgVer').onclick = e => {
  verOnly = !verOnly;
  e.target.setAttribute('aria-pressed', verOnly);
  e.target.textContent = verOnly ? SCREEN_SPEC.meta.version + ' 변경분' : '이번 변경분';
  applyFilters();
};

/* 원본 보기 — 현재 화면·현재 상태 그대로 100% 배율로 펼칩니다 */
/* ═══════════════════════════════════════════════════════════════════
   인쇄 — 페이지를 스크립트가 직접 나눕니다.

   화면을 통째로 축소해 찍지 않습니다. 그러면 목업 단과 디스크립션 단이
   서로 다른 지점에서 잘려 '끊어진 디자인 + 끊어진 설명'이 나옵니다.
   브라우저의 break-inside:avoid 에 맡겨도 빈 페이지가 섞입니다.

   그래서 실제 높이를 재서 A4 한 장 분량씩 직접 담습니다.
     1) 인쇄 폭 그대로 화면 밖에 한 번 그려 놓고 영역·카드 높이를 잽니다.
     2) 남은 높이에 안 들어가면 다음 장으로 넘깁니다. 자르지 않습니다.
     3) 한 장보다 큰 영역·카드는 그 장을 통째로 쓰고 들어갈 만큼 축소합니다.
     4) 화면(메뉴)이 바뀌면 반드시 새 장에서 시작합니다.
   ═══════════════════════════════════════════════════════════════════ */
const PRINT = {
  pageWmm:297, pageHmm:210, marginMm:8,
  colGapMm:6,
  mkRatio:0.70,   /* 한 장 안에서 목업이 차지하는 가로 비율 — 나머지가 디스크립션 */
  spZoom:0.75     /* 디스크립션 축소율 — 목업 글자 크기와 비슷해지도록 맞춥니다 */
};
const MM_PX = 96/25.4;

/* 페이지마다 반복되는 머리글 — 화면에서 보이는 상단 정보를 그대로 옮깁니다 */
function printHeadHtml(m){
  /* 화면 선택은 화면에서 보이는 그대로 — 메인페이지 / 서브 페이지 두 묶음이고,
     지금 보고 있는 화면 이름만 묶음 옆에 적습니다(전체 목록을 늘어놓지 않습니다) */
  const grp  = (m.kind || 'main') === 'main' ? 'main' : 'sub';
  const chip = (key, label) =>
    `<span class="tab${key===grp?' on':''}">${label}${key===grp ? ' · ' + m.label : ''} ▾</span>`;
  const tabs = `<span class="tabs">${chip('main','메인페이지')}${chip('sub','서브 페이지')}</span>`;
  return `<div class="pd-h1">
      <span class="c">${m.crumb}</span>
      <span class="t">${m.screenNo}  ${m.name}</span>
      <span class="c">${SCREEN_SPEC.meta.projectName}</span>
    </div>
    <div class="pd-h2">
      ${tabs}
      <span class="ver">${SCREEN_SPEC.meta.version} · ${SCREEN_SPEC.meta.date} · ${SCREEN_SPEC.meta.author}</span>
    </div>`;
}

/* 이미지가 다 뜬 뒤에 재야 합니다. 로딩 전에는 높이가 0 으로 잡혀
   페이지 배치가 통째로 어긋납니다. */
function imagesReady(root){
  const imgs = [...root.querySelectorAll('img')].filter(im=>!im.complete);
  if(!imgs.length) return Promise.resolve();
  return Promise.all(imgs.map(im=>new Promise(res=>{
    im.addEventListener('load', res, {once:true});
    im.addEventListener('error', res, {once:true});
  })));
}

/* 사전 조판과 인쇄 버튼이 동시에 돌면 측정용 DOM 을 서로 덮어써 조판이 깨집니다.
   진행 중인 조판이 있으면 그것을 기다렸다가 이어서 실행합니다. */
let printJob = null;
function buildPrintDoc(scope){
  const run = () => buildPrintDocOnce(scope);
  printJob = printJob ? printJob.then(run, run) : run();
  return printJob;
}

async function buildPrintDocOnce(scope){
  const host = $('#printDoc');
  const pageW = (PRINT.pageWmm - PRINT.marginMm*2) * MM_PX;
  const pageH = (PRINT.pageHmm - PRINT.marginMm*2) * MM_PX - 2; /* 반올림 여유 */
  const gap   = PRINT.colGapMm * MM_PX;
  /* 화면과 같은 구성 — 왼쪽 목업, 오른쪽 그 영역의 디스크립션 */
  const mkW    = Math.round((pageW - gap) * PRINT.mkRatio);
  const spW    = Math.round(pageW - gap - mkW);
  const mkZoom = Math.min(1, mkW / MOCK_W);
  /* 디스크립션은 축소해 싣습니다. 줄어든 만큼 안쪽 폭을 넓혀 잡아야 한 칸을 꽉 채웁니다 */
  const spZ   = PRINT.spZoom;
  const spInW = Math.round(spW / spZ);

  const PM = (scope === 'one') ? [SCREEN_SPEC.menus[curMenu]] : SCREEN_SPEC.menus;

  /* ── 1) 측정 : 인쇄에 쓸 폭 그대로 화면 밖에 한 번 그립니다 ────────── */
  host.removeAttribute('style');
  host.className = 'measuring';
  host.style.width = pageW + 'px';
  host.innerHTML = PM.map((m,mi)=>{
    const secs = buildSections(m, 'default');
    return `<div data-probe="${mi}">
      <div class="pd-hprobe">${printHeadHtml(m)}</div>
      <div class="pd-pprobe"><div class="pd-part"><span>측정</span></div></div>
      <div class="pd-mk-in" style="width:${MOCK_W}px;zoom:${mkZoom}">
        ${secs.map((s,i)=>`<div data-blk="${i}">${s.html}</div>`).join('')}
      </div>
      <div class="pd-cols"><div class="pd-col" style="width:${spInW}px;zoom:${spZ};flex:none">
        ${specCardsHtml(m)}
      </div></div>
    </div>`;
  }).join('');
  /* 사내 논의 내용은 인쇄본에 싣지 않습니다. 측정 전에 지워야 높이 계산이 맞습니다 */
  host.querySelectorAll('details.iss').forEach(d=>d.remove());
  await imagesReady(host);

  const H = el => el ? el.getBoundingClientRect().height : 0;
  const measured = PM.map((m,mi)=>{
    const probe = host.querySelector(`[data-probe="${mi}"]`);
    return {
      head : H(probe.querySelector('.pd-hprobe')),
      part : H(probe.querySelector('.pd-pprobe')),
      blocks: [...probe.querySelectorAll('[data-blk]')].map(el=>H(el)),
      cards : [...probe.querySelectorAll('.pd-col > .spec')]
                .map(el=>({no: el.dataset.specId, h: H(el), html: el.outerHTML}))
    };
  });

  /* ── 2) 배치 : 목업 영역과 그 영역의 항목 카드를 같은 장에 담습니다 ──
     좌우 어느 쪽이든 남은 높이를 넘기면 다음 장으로 넘깁니다. 자르지 않습니다. */
  const pages = [];
  PM.forEach((m, mi)=>{
    const M = measured[mi];
    const bodyH = pageH - M.head - M.part;
    const secs = buildSections(m, 'default');
    const head = printHeadHtml(m);
    const byNo = {}; M.cards.forEach(c=>{ byNo[c.no] = c; });
    const used = {};
    const local = [];

    let mk = [], sp = [], accL = 0, accR = 0;
    const flush = ()=>{
      if(!mk.length && !sp.length) return;
      local.push({head, mk, sp, h:pageH});
      mk = []; sp = []; accL = 0; accR = 0;
    };

    secs.forEach((s, i)=>{
      const hL = M.blocks[i] || 0;
      /* 이 목업 영역이 안고 있는 항목 카드 — 아직 안 실린 것만 */
      const ids = [...new Set((s.html.match(/data-spec-id="(\d+)"/g) || []).map(x=>x.slice(14,-1)))];
      const add = ids.filter(n => byNo[n] && !used[n]).map(n => byNo[n]);
      const hR  = add.reduce((a,c)=>a + c.h, 0);
      if((accL + hL > bodyH || accR + hR > bodyH) && (mk.length || sp.length)) flush();
      /* 한 장보다 큰 영역은 그 장을 통째로 쓰고 줄여 담습니다 */
      const zoom = hL > bodyH ? mkZoom * (bodyH / hL) : mkZoom;
      mk.push({html:s.html, zoom});
      accL += Math.min(hL, bodyH);
      add.forEach(c=>{ used[c.no] = 1; sp.push(c.html); accR += c.h; });
    });

    /* 목업에 영역이 없는 카드는 검사가 오류로 잡지만, 남으면 뒤에 붙입니다 */
    M.cards.filter(c=>!used[c.no]).forEach(c=>{
      if(accR + c.h > bodyH && (mk.length || sp.length)) flush();
      sp.push(c.html); accR += c.h;
    });
    flush();

    local.forEach((p, i)=>{
      p.part = `${m.screenNo} ${m.name} · 항목 ${m.items.length}`;
      p.pg   = `${i+1} / ${local.length}`;
      pages.push(p);
    });
  });

  /* ── 3) 조판 ──────────────────────────────────────────────────── */
  host.removeAttribute('class');
  host.removeAttribute('style');
  host.innerHTML = pages.map((p, i)=>`
    <div class="pd-page" style="width:${pageW}px;height:${p.h}px">
      ${p.head}
      <div class="pd-part"><span>${p.part}</span><span class="sp"></span>
        <span class="pg">${p.pg} · ${i+1}/${pages.length}쪽</span></div>
      <div class="pd-cols" style="gap:${gap}px">
        <div class="pd-col pd-mk-col" style="width:${mkW}px;flex:none">
          ${p.mk.map(b=>`<div class="pd-mk-in" style="width:${MOCK_W}px;zoom:${b.zoom.toFixed(4)}">${b.html}</div>`).join('')}
        </div>
        <div class="pd-col pd-sp-col" style="width:${spInW}px;zoom:${spZ};flex:none">${p.sp.join('')}</div>
      </div>
    </div>`).join('');
  host.querySelectorAll('details.iss').forEach(d=>d.remove());  /* 논의는 인쇄본에 싣지 않습니다 */
  host.querySelectorAll('.hb').forEach(el=>el.remove());        /* 호버 띠도 인쇄에 쓸모없습니다 */
  return pages.length;
}

/* 'one' 이면 지금 보고 있는 화면만, 없으면 전 화면을 찍습니다.
   화면이 열두 개로 늘어 전 화면 인쇄는 67장이라 미리보기가 오래 걸립니다. */
async function doPrint(scope){ await buildPrintDoc(scope); window.print(); }

/* 브라우저 메뉴(Ctrl+P)로 인쇄해도 같은 문서가 나오도록, 화면이 뜬 뒤
   미리 한 번 조판해 둡니다. beforeprint 는 비동기를 기다려 주지 않습니다. */
/* 원격 서체가 2.5초 안에 오지 않으면 링크를 걷어냅니다.
   그대로 두면 인쇄 미리보기가 그 요청을 기다리며 "로드 중"에서 멈춥니다. */
setTimeout(()=>{ const l = document.getElementById('fontCss');
  if(l && l.rel !== 'stylesheet') l.remove(); }, 2500);

window.addEventListener('load', ()=>{
  const pre = ()=>buildPrintDoc('one');
  'requestIdleCallback' in window ? requestIdleCallback(pre) : setTimeout(pre, 300);
});

function openZoom(){
  const m = SCREEN_SPEC.menus[curMenu];
  const secs = buildSections(m, curState);
  $('#zoomTitle').textContent = `${m.screenNo}  ${m.name} — ${m.states.find(s=>s.id===curState).label} · 100%`;
  const sheet = $('#zoomSheet');
  sheet.style.width = MOCK_W + 'px';
  sheet.style.setProperty('--inv', 1);
  sheet.innerHTML = secs.map(s=>s.html).join('');
  $('#zoom').classList.add('open');
  document.body.style.overflow = 'hidden';
  sheet.querySelectorAll('.rgn').forEach(el=>{
    const id = el.dataset.specId;
    el.addEventListener('mouseenter', e=>{ e.stopPropagation(); setActive(id); });
  });
}
/* 목업 안의 글자·화면 설정 팝업 — 눌러서 열고 닫으며 확인할 수 있게 합니다 */
function toggleViewSettings(){
  mockViewOpen = !mockViewOpen;
  renderUI();
  if($('#zoom').classList.contains('open')) openZoom();
}

function closeZoom(){ $('#zoom').classList.remove('open'); document.body.style.overflow=''; }
$('#tgZoom').onclick = openZoom;
$('#zoom').addEventListener('click', e=>{ if(e.target.id === 'zoom') closeZoom(); });

/* 참고 이미지 라이트박스 — refs 안의 이미지 링크 클릭 시 새 탭 대신 오버레이로 표시 */
function openRefImg(src){
  $('#refimgImg').src = src;
  $('#refimg').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeRefImg(){ $('#refimg').classList.remove('open'); document.body.style.overflow=''; }
$('#refimg').addEventListener('click', e=>{ if(e.target.id === 'refimg') closeRefImg(); });

document.addEventListener('keydown', e=>{ if(e.key === 'Escape'){ closeZoom(); closeMtx(); closeHist(); closeChk(); closeRefImg(); } });

function renderAll(){
  const m = SCREEN_SPEC.menus[curMenu];
  $('#crumb').textContent = m.crumb;
  $('#docTitle').textContent = `${m.screenNo}  ${m.name}`;
  $('#proj').textContent = SCREEN_SPEC.meta.projectName;
  $('#footMeta').textContent =
    `${SCREEN_SPEC.meta.date} · ${SCREEN_SPEC.meta.version} · ${SCREEN_SPEC.meta.author}`;
  const cur = SCREEN_SPEC.meta.version;
  const isBaseline = SCREEN_SPEC.history.length <= 1;
  const chg = m.items.filter(i=>itemVer(m.id, i.no)===cur).length;
  $('#footVer').innerHTML = isBaseline
    ? `이 화면은 ${cur} 기준 전체 <b style="color:var(--primary)">${chg}건</b>`
    : chg
      ? `이 화면의 ${cur} 변경 항목 <b style="color:var(--primary)">${chg}건</b>`
      : `이 화면은 ${cur} 에서 변경되지 않았습니다`;
  $('#tgCol').textContent = '단 ' + cols;
  renderMenuSeg(); renderStateBar(); renderPanel(); renderUI();
  const back = $('#btnBack');
  back.style.display = navStack.length ? '' : 'none';
  if(navStack.length){
    const p = SCREEN_SPEC.menus[navStack[navStack.length-1].menu];
    back.textContent = `← ${p.screenNo} 로 돌아가기`;
  }
}

scaleCanvas();
/* 고객 전달 전에는 전 항목이 v1.0 이라 '이번 변경분'이 성립하지 않습니다 */
if(isInternal()) $('#tgVer').style.display = 'none';
cols = SCREEN_SPEC.menus[0].columns;
renderAll();
</script>
